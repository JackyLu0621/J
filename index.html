<style>
/* =====================================================
   基礎變數
   ===================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{
  --ease:cubic-bezier(.22,.8,.24,1);
  --k:1;                 /* 書背縮放係數（手機會縮小） */
  --fs:19px;             /* 閱讀字級（由 JS 控制） */
  --font-serif:"Noto Serif TC","Source Han Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif;
  --font-sans:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (max-width:600px){:root{--k:.82}}

/* 閱讀器主題 */
:root[data-theme="parchment"]{
  --paper:#fbf9f4; --ink:#2b2b2b; --ink-soft:#7a7467; --rule:rgba(43,43,43,.14);
  --nav-rgb:251,249,244; --nav-ink:#2b2b2b;
  --chip:rgba(43,43,43,.06); --chip-hover:rgba(43,43,43,.13);
  --panel:#fffdf8; --accent-read:#8a5a2b; --on-accent:#fff;
  --ink-strong:#141414;
  --c-red:#b3261e; --c-orange:#c2570c; --c-gold:#9a6a00; --c-green:#2e7d32; --c-teal:#0f766e; --c-blue:#1d5fb4; --c-purple:#7b3fa0; --c-pink:#c2185b; --c-gray:#7a7467;
  --m-gold:rgba(255,205,60,.5); --m-red:rgba(255,120,110,.36); --m-blue:rgba(100,170,255,.4); --m-green:rgba(110,210,130,.4); --m-purple:rgba(190,140,240,.4);
}
:root[data-theme="night"]{
  --paper:#050505; --ink:#b5b1a7; --ink-soft:#77736a; --rule:rgba(255,255,255,.10);
  --nav-rgb:12,12,13; --nav-ink:#d6d2c8;
  --chip:rgba(255,255,255,.07); --chip-hover:rgba(255,255,255,.15);
  --panel:#151517; --accent-read:#d4b06a; --on-accent:#1a1408;
  --ink-strong:#ece8de;
  --c-red:#ff7b72; --c-orange:#ffa657; --c-gold:#e3b341; --c-green:#7ee787; --c-teal:#56d4c6; --c-blue:#79b8ff; --c-purple:#c9a0f0; --c-pink:#ff8ac1; --c-gray:#8b8678;
  --m-gold:rgba(227,179,65,.3); --m-red:rgba(255,123,114,.28); --m-blue:rgba(121,184,255,.28); --m-green:rgba(126,231,135,.26); --m-purple:rgba(201,160,240,.28);
}

body{
  margin:0; min-height:100vh; min-height:100dvh;
  background:#121212; color:#ece7da;
  font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  transition:background-color .45s ease;
}
body[data-view="reader"]{background:var(--paper)}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

.view{opacity:0;transition:opacity .32s ease}
.view.active{opacity:1}

/* =====================================================
   第一層：虛擬書架
   ===================================================== */
.shelf-view{
  position:relative; min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column; justify-content:center;
  padding:48px 0 40px; overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,#1d1c1a 0%,#121212 55%,#090909 100%);
}
.ambient{
  position:absolute; inset:-20%; pointer-events:none;
  background:
    radial-gradient(38% 32% at 24% 28%,rgba(217,178,95,.10),transparent 70%),
    radial-gradient(34% 30% at 78% 72%,rgba(52,168,130,.08),transparent 70%);
  animation:drift 24s ease-in-out infinite alternate;
}
@keyframes drift{
  from{transform:translate3d(-2%,-1%,0) scale(1)}
  to{transform:translate3d(3%,2%,0) scale(1.08)}
}
.shelf-head{position:relative;text-align:center;padding:0 24px 8px}
.shelf-title{
  margin:0; font-family:var(--font-serif); font-weight:700;
  font-size:clamp(26px,4.2vw,42px); letter-spacing:.32em; padding-left:.32em;
  background:linear-gradient(180deg,#f6e7b8,#b98f3e);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.shelf-tagline{margin:10px 0 0;color:#8d877a;letter-spacing:.3em;font-size:13px;font-family:var(--font-serif)}
.shelf-stage{position:relative;margin-top:12px}

.shelf-scroller{
  overflow-x:auto; overflow-y:hidden;
  padding:64px 0 44px;
  background:linear-gradient(180deg,rgba(255,255,255,.012),rgba(0,0,0,.28));
  box-shadow:inset 0 24px 46px rgba(0,0,0,.55),inset 0 -10px 24px rgba(0,0,0,.35);
  scrollbar-width:none; -ms-overflow-style:none;
  -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain;
}
.shelf-scroller::-webkit-scrollbar{display:none}
.shelf-inner{display:flex;flex-direction:column;width:max-content;min-width:100%}
.shelf-books{display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:0 48px;min-height:120px}
.shelf-board{
  height:26px; margin-top:-1px; position:relative;
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 2px,transparent 2px 9px),
    linear-gradient(180deg,#8d6439 0,#6b4a2b 14%,#4a321c 62%,#2b1c0e 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 2px 0 #170e06,0 24px 30px -8px rgba(0,0,0,.85);
}
.shelf-status{
  align-self:center; margin:0; max-width:640px; text-align:center;
  color:#a39c8d; font-size:15px; line-height:1.9; white-space:pre-line;
}
.shelf-status.is-error{
  color:#f0c6c0; background:rgba(160,36,56,.14); border:1px solid rgba(214,88,106,.35);
  padding:18px 22px; border-radius:14px; text-align:left;
}
.shelf-hint{margin:16px 0 0;text-align:center;color:#6f695d;font-size:12px;letter-spacing:.2em}

/* ---- 書背 ---- */
.spine{
  --band:rgba(255,226,150,.65); --tshadow:0 1px 0 rgba(0,0,0,.55);
  position:relative; flex:none; padding:0; border:0; cursor:pointer;
  width:calc(var(--w)*1px*var(--k)); height:calc(var(--h)*1px*var(--k));
  border-radius:3px 3px 2px 2px;
  font-family:var(--font-serif); color:var(--ink);
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),
    linear-gradient(90deg,var(--c1) 0%,var(--c2) 18%,var(--c3) 42%,var(--c2) 70%,var(--c1) 100%);
  box-shadow:
    inset 3px 0 5px rgba(255,255,255,.14),
    inset -5px 0 9px rgba(0,0,0,.5),
    0 12px 22px rgba(0,0,0,.6);
  transform-origin:50% 100%;
  transition:transform .45s var(--ease),box-shadow .45s var(--ease),filter .45s ease;
  animation:spineIn .8s var(--ease) backwards;
}
@keyframes spineIn{from{opacity:0;transform:translateY(26px)}}
.spine::before,.spine::after{
  content:""; position:absolute; left:0; right:0; pointer-events:none;
  height:calc(8px*var(--k)); border-top:2px solid var(--band); border-bottom:1px solid var(--band);
}
.spine::before{top:calc(14px*var(--k))}
.spine::after{bottom:calc(14px*var(--k))}
.spine-face{
  position:absolute; left:0; right:0; top:calc(36px*var(--k)); bottom:calc(48px*var(--k));
  display:flex; align-items:center; justify-content:center; pointer-events:none;
}
.spine-text{
  writing-mode:vertical-rl; max-height:100%; white-space:nowrap; line-height:1.25;
  color:var(--ink); text-shadow:var(--tshadow);
}
.spine-title{display:block;text-align:center;font-weight:700;letter-spacing:.12em;font-size:calc(var(--tfs)*1px*var(--k))}
.spine-sub{display:block;text-align:center;margin-block-start:calc(9px*var(--k));opacity:.85;letter-spacing:.2em;font-size:calc(var(--sfs)*1px*var(--k))}
.spine-orn{
  position:absolute; left:0; right:0; bottom:calc(27px*var(--k)); text-align:center;
  font-size:calc(12px*var(--k)); color:var(--band); pointer-events:none;
}
.spine--gold{--c1:#6e5320;--c2:#c9a44c;--c3:#f0d98c;--ink:#2a1d05;--glow:rgba(240,200,110,.55);--band:rgba(70,45,5,.55);--tshadow:0 1px 0 rgba(255,255,255,.35)}
.spine--emerald{--c1:#0a3629;--c2:#15735a;--c3:#33a581;--ink:#f3e7c2;--glow:rgba(52,168,130,.5)}
.spine--sapphire{--c1:#0e2858;--c2:#2255ad;--c3:#5b8de0;--ink:#f3e7c2;--glow:rgba(91,141,224,.5)}
.spine--crimson{--c1:#4b0d19;--c2:#9d2336;--c3:#d4586a;--ink:#f7e4bb;--glow:rgba(212,88,106,.5)}
.spine:active{transform:translateY(-6px) scale(1.02)}
.spine:focus-visible{outline:2px solid #f0d98c;outline-offset:4px}
@media (hover:hover){
  .spine:hover{
    transform:translateY(-18px) scale(1.05); z-index:3; filter:brightness(1.12);
    box-shadow:
      inset 3px 0 5px rgba(255,255,255,.2),inset -5px 0 9px rgba(0,0,0,.45),
      0 26px 34px rgba(0,0,0,.65),0 0 44px var(--glow);
  }
}

/* =====================================================
   第二層：書封面
   ===================================================== */
.cover-view{
  --accent-rgb:217,178,95;
  position:relative; min-height:100vh; min-height:100dvh; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  padding:80px 24px 56px;
  background:
    radial-gradient(80% 60% at 50% 0%,rgba(var(--accent-rgb),.22),transparent 70%),
    radial-gradient(60% 50% at 50% 100%,rgba(var(--accent-rgb),.10),transparent 70%),
    #0c0c0e;
}
.cover-view[data-color="gold"]{--accent-rgb:217,178,95}
.cover-view[data-color="emerald"]{--accent-rgb:52,168,130}
.cover-view[data-color="sapphire"]{--accent-rgb:91,141,224}
.cover-view[data-color="crimson"]{--accent-rgb:212,88,106}

.back-link{
  position:absolute; top:max(20px,env(safe-area-inset-top)); left:20px;
  padding:9px 16px; border-radius:999px; cursor:pointer; font-size:14px; letter-spacing:.08em;
  color:#cfc8b8; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
  transition:background .25s ease,transform .25s ease;
}
.back-link:hover{background:rgba(255,255,255,.12);transform:translateX(-2px)}
.cover-inner{position:relative;width:100%;max-width:620px;display:flex;flex-direction:column;align-items:center}
.cover-title{
  margin:0; font-family:var(--font-serif); font-weight:700; line-height:1.15;
  font-size:clamp(44px,10vw,92px); letter-spacing:.12em; padding-left:.12em;
  background:linear-gradient(180deg,#ffffff 0%,rgb(var(--accent-rgb)) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 8px 26px rgba(var(--accent-rgb),.35));
}
.cover-sub{margin:18px 0 0;font-family:var(--font-serif);font-size:clamp(17px,3vw,24px);letter-spacing:.3em;padding-left:.3em;color:rgb(var(--accent-rgb))}
.cover-rule{
  width:min(220px,50%); height:1px; margin:28px 0 22px; border:0;
  background:linear-gradient(90deg,transparent,rgba(var(--accent-rgb),.8),transparent);
}
.cover-author{margin:0;color:#b9b2a2;letter-spacing:.35em;padding-left:.35em;font-size:15px;font-family:var(--font-serif)}
.cover-card{
  margin-top:30px; width:100%; padding:24px 26px; border-radius:18px; text-align:left;
  background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.11);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}
.cover-synopsis{margin:0;color:#cdc7b9;line-height:1.95;font-size:16px;letter-spacing:.04em;white-space:pre-line;font-family:var(--font-serif)}
.btn-read{
  margin-top:34px; padding:16px 44px 16px calc(44px + .4em); border-radius:999px; cursor:pointer;
  font-family:var(--font-serif); font-weight:600; font-size:18px; letter-spacing:.4em; color:#fff8e8;
  border:1px solid rgba(var(--accent-rgb),.75);
  background:linear-gradient(180deg,rgba(var(--accent-rgb),.30),rgba(var(--accent-rgb),.12));
  animation:breathe 3.2s ease-in-out infinite;
  transition:transform .3s var(--ease);
}
.btn-read:hover{transform:scale(1.05)}
.btn-read:disabled{animation:none;opacity:.7;cursor:wait;transform:none}
@keyframes breathe{
  0%,100%{box-shadow:0 0 14px rgba(var(--accent-rgb),.25),0 0 0 0 rgba(var(--accent-rgb),.35)}
  50%{box-shadow:0 0 34px rgba(var(--accent-rgb),.55),0 0 0 12px rgba(var(--accent-rgb),0)}
}
.cover-msg{margin:18px 0 0;min-height:1.5em;color:#f0c6c0;font-size:14px;line-height:1.8;white-space:pre-line}
.cover-view.active .cover-title{animation:rise .9s var(--ease) both}
.cover-view.active .cover-sub{animation:rise .9s .12s var(--ease) both}
.cover-view.active .cover-rule,.cover-view.active .cover-author{animation:rise .9s .22s var(--ease) both}
.cover-view.active .cover-card{animation:rise .9s .32s var(--ease) both}
.cover-view.active .btn-read{animation:rise .9s .44s var(--ease) both,breathe 3.2s 1.4s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* =====================================================
   第三層：閱讀器
   ===================================================== */
.reader-view{min-height:100vh;min-height:100dvh;background:var(--paper);color:var(--ink);transition:opacity .32s ease,background-color .45s ease,color .45s ease}

.reader-nav{
  position:sticky; top:0; z-index:50;
  background:rgba(var(--nav-rgb),.74); color:var(--nav-ink);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);
  transition:background-color .45s ease,color .45s ease;
}
.nav-inner{display:flex;align-items:center;gap:8px;padding:10px 20px;padding-top:max(10px,env(safe-area-inset-top))}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.chip-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  height:36px; padding:0 14px; border-radius:999px; cursor:pointer; white-space:nowrap;
  font-size:14px; color:var(--nav-ink); background:var(--chip); border:1px solid var(--rule);
  transition:background .2s ease,transform .2s ease,opacity .2s ease;
}
.chip-btn:hover:not(:disabled){background:var(--chip-hover)}
.chip-btn:active:not(:disabled){transform:scale(.96)}
.chip-btn:disabled{opacity:.35;cursor:not-allowed}
.chip-btn:focus-visible{outline:2px solid var(--accent-read);outline-offset:2px}
.btn-home{background:var(--accent-read);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn-home:hover:not(:disabled){background:var(--accent-read);filter:brightness(1.1)}
.icon-btn{min-width:36px;padding:0 10px;font-weight:600;font-family:var(--font-sans)}
.font-ctl{display:flex;align-items:center;gap:6px}
.fs-value{min-width:2ch;text-align:center;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

.dropdown{min-width:0}
.dd-toggle{max-width:min(160px,34vw);min-width:0}
.dd-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dd-caret{font-size:11px;opacity:.7;transition:transform .25s ease}
.dd-toggle[aria-expanded="true"] .dd-caret{transform:rotate(180deg)}
.chapter-panel{
  position:absolute; top:calc(100% + 6px); right:20px;
  width:min(380px,calc(100vw - 32px));
  background:var(--panel); color:var(--ink);
  border:1px solid var(--rule); border-radius:16px; overflow:hidden;
  box-shadow:0 22px 56px rgba(0,0,0,.35);
  animation:pop .22s var(--ease);
  transform-origin:top right;
}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.panel-head{padding:12px 16px;font-size:12px;letter-spacing:.2em;color:var(--ink-soft);border-bottom:1px solid var(--rule)}
.chapter-list{list-style:none;margin:0;padding:6px;position:relative;max-height:min(60vh,440px);overflow-y:auto;overscroll-behavior:contain}
.chapter-item{
  display:flex; align-items:baseline; gap:12px; width:100%; padding:11px 12px; border:0; border-radius:10px;
  background:none; cursor:pointer; text-align:left; color:var(--ink); font-family:var(--font-serif); font-size:15px; line-height:1.5;
  transition:background .15s ease;
}
.chapter-item:hover{background:var(--chip)}
.chapter-item .num{flex:none;min-width:2.2ch;text-align:right;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.chapter-item.is-active{background:var(--chip-hover);color:var(--accent-read);font-weight:600}

.progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none}
.progress-bar{height:100%;width:100%;background:var(--accent-read);transform:scaleX(0);transform-origin:left}

.reader-main{padding:0 24px}
.reader-column{max-width:720px;margin:0 auto;padding:64px 0 96px}
.chapter-kicker{margin:0 0 14px;color:var(--ink-soft);font-size:13px;letter-spacing:.3em}
.chapter-title{
  margin:0 0 44px; padding-bottom:26px; border-bottom:1px solid var(--rule);
  font-family:var(--font-serif); font-weight:700; line-height:1.4; letter-spacing:.06em;
  font-size:calc(var(--fs) + 10px);
}
.chapter.is-in{animation:chapterIn .6s var(--ease) both}
.chapter.is-in.is-loading{animation:none;opacity:.4;transition:opacity .25s ease}
@keyframes chapterIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.prose{font-family:var(--font-serif);color:var(--ink)}
.prose p{
  margin:0 0 1.4em; font-size:var(--fs); line-height:1.8; letter-spacing:.5px;
  text-align:justify; text-justify:inter-character; overflow-wrap:break-word;
}
.prose hr{border:0;margin:2.4em 0;text-align:center;height:1em;line-height:1}
.prose hr::before{content:"◆　◆　◆";font-size:.8em;letter-spacing:.2em;color:var(--ink-soft)}
.prose blockquote{margin:0 0 1.4em;padding:.2em 1.2em;border-left:3px solid var(--rule);color:var(--ink-soft)}
.prose img{max-width:100%;height:auto}
.prose ::selection,.chapter-title::selection{background:rgba(138,90,43,.28)}

/* ---- 內文豐富樣式（作者可用的 class 白名單） ---- */
.prose strong,.prose b{font-weight:700;color:var(--ink-strong)}
.prose u{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.25em}
.prose mark{background:linear-gradient(transparent 52%,var(--m-gold) 52%);color:inherit;padding:0 .12em;border-radius:2px}
.prose mark.m-gold{background:linear-gradient(transparent 52%,var(--m-gold) 52%)}
.prose mark.m-red{background:linear-gradient(transparent 52%,var(--m-red) 52%)}
.prose mark.m-blue{background:linear-gradient(transparent 52%,var(--m-blue) 52%)}
.prose mark.m-green{background:linear-gradient(transparent 52%,var(--m-green) 52%)}
.prose mark.m-purple{background:linear-gradient(transparent 52%,var(--m-purple) 52%)}
.prose .c-red{color:var(--c-red)}
.prose .c-orange{color:var(--c-orange)}
.prose .c-gold{color:var(--c-gold)}
.prose .c-green{color:var(--c-green)}
.prose .c-teal{color:var(--c-teal)}
.prose .c-blue{color:var(--c-blue)}
.prose .c-purple{color:var(--c-purple)}
.prose .c-pink{color:var(--c-pink)}
.prose .c-gray{color:var(--c-gray)}
.prose .big{font-size:1.28em;line-height:1.4}
.prose p.big{font-size:calc(var(--fs)*1.28)}
.prose .small{font-size:.84em;color:var(--ink-soft)}
.prose p.small{font-size:calc(var(--fs)*.84)}
.prose .spaced{letter-spacing:.35em}
.prose .glow{text-shadow:0 0 .7em currentColor}
.prose .whisper{font-size:.88em;color:var(--ink-soft);font-style:italic;letter-spacing:.12em}
.prose p.whisper{font-size:calc(var(--fs)*.88)}
.prose .center{text-align:center}
.prose .right{text-align:right}
.prose .indent{text-indent:2em}
.prose p.dropcap::first-letter{float:left;font-size:3.5em;line-height:.88;padding:.06em .1em 0 0;font-weight:700;color:var(--accent-read)}
.prose .mono,.prose code,.prose kbd,.prose pre{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK TC",monospace}
.prose code,.prose kbd{font-size:.86em;letter-spacing:0;background:var(--chip);border:1px solid var(--rule);border-radius:5px;padding:.08em .4em}
.prose pre{margin:0 0 1.4em;padding:1em 1.2em;overflow:auto;background:var(--chip);border-radius:10px;font-size:calc(var(--fs) - 3px);line-height:1.6;letter-spacing:0;white-space:pre-wrap}
.prose sup,.prose sub{font-size:.7em;line-height:0}
.prose ruby rt{font-size:.5em;letter-spacing:0;color:var(--ink-soft)}
.prose a{color:var(--accent-read);text-underline-offset:.22em}

.prose h2{margin:2.4em 0 1em;padding-left:.8em;border-left:4px solid var(--accent-read);font-size:calc(var(--fs) + 5px);line-height:1.4;letter-spacing:.08em;font-weight:700;color:var(--ink-strong)}
.prose h3{margin:2em 0 .7em;font-size:calc(var(--fs) + 1px);letter-spacing:.14em;font-weight:700;color:var(--accent-read)}
.prose h4{margin:1.6em 0 .5em;font-size:calc(var(--fs) - 3px);letter-spacing:.3em;font-weight:600;color:var(--ink-soft)}
.prose hr.line{height:0;border-top:1px solid var(--rule);margin:2.4em 0}
.prose hr.line::before{content:none}
.prose hr.star::before{content:"✦"}

.prose blockquote.pull{margin:2.4em 0;padding:1.2em 1em;border:0;text-align:center;font-size:calc(var(--fs)*1.22);line-height:1.7;letter-spacing:.1em;color:var(--accent-read);font-weight:600}
.prose blockquote.pull::before{content:"❝";display:block;font-size:2em;line-height:.8;opacity:.5;margin-bottom:.2em}
.prose blockquote.pull p{font-size:inherit;margin:0}

.prose .box{--bc:var(--c-blue);margin:1.9em 0;padding:1em 1.3em;border-radius:12px;border:1px solid var(--rule);border-left:5px solid var(--bc);background:var(--chip);background:color-mix(in srgb,var(--bc) 9%,transparent)}
.prose .box-info{--bc:var(--c-blue)}
.prose .box-warn{--bc:var(--c-gold)}
.prose .box-danger{--bc:var(--c-red)}
.prose .box-ok{--bc:var(--c-green)}
.prose .box-secret{--bc:var(--c-purple)}
.prose .box p,.prose .doc p{font-size:calc(var(--fs) - 1px);margin:0 0 .8em;text-align:left}
.prose .box p:last-child,.prose .doc p:last-child{margin-bottom:0}
.prose .doc{margin:2em 0;padding:1.3em 1.6em;background:var(--panel);border:1px solid var(--rule);border-top:4px double var(--ink-soft);border-radius:4px;box-shadow:0 8px 26px rgba(0,0,0,.12)}
.prose p.box-title{margin:0 0 .7em;font-size:calc(var(--fs) - 4px);font-weight:700;letter-spacing:.3em;color:var(--bc,var(--accent-read));text-align:left}
.prose .terminal{--c-red:#ff7b72;--c-orange:#ffa657;--c-gold:#e3b341;--c-green:#7ee787;--c-teal:#56d4c6;--c-blue:#79b8ff;--c-purple:#c9a0f0;--c-pink:#ff8ac1;--c-gray:#8b8678;--ink-strong:#c8ffd9;--bc:#5fd38a;margin:2em 0;padding:1em 1.3em 1.1em;border-radius:12px;background:#0a0f0c;border:1px solid #1d2b22;box-shadow:0 0 0 1px rgba(95,211,138,.08),0 12px 36px rgba(0,0,0,.35);color:#7ee7a0}
.prose .terminal::before{content:"● ● ●";display:block;margin-bottom:.8em;font-size:12px;letter-spacing:.35em;color:#2f4a38}
.prose .terminal p{margin:0 0 .5em;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK TC",monospace;font-size:calc(var(--fs) - 3px);line-height:1.7;letter-spacing:0;text-align:left;color:inherit}
.prose .terminal p:last-child{margin-bottom:0}

.prose .redact{background:var(--ink);color:transparent;border-radius:3px;padding:0 .2em;cursor:pointer;transition:background .35s ease,color .35s ease;-webkit-user-select:none;user-select:none}
.prose .redact:hover{background:var(--ink-soft)}
.prose .redact.show{background:transparent;color:var(--c-red);box-shadow:inset 0 -2px 0 var(--c-red);-webkit-user-select:text;user-select:text}
.prose .redact:focus-visible{outline:2px solid var(--accent-read);outline-offset:2px}

.prose figure{margin:2.2em 0;text-align:center}
.prose figure img,.prose .gallery img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.22);cursor:zoom-in;transition:transform .4s var(--ease),box-shadow .4s ease}
.prose figure img:hover{transform:scale(1.015);box-shadow:0 18px 46px rgba(0,0,0,.3)}
:root[data-theme="night"] .prose img{filter:brightness(.88) contrast(1.02)}
.prose figcaption{margin-top:.9em;font-size:13px;letter-spacing:.12em;line-height:1.7;color:var(--ink-soft)}
.prose figure.wide{width:max(100%,min(960px,calc(100vw - 64px)));margin-left:calc((100% - max(100%,min(960px,calc(100vw - 64px))))/2)}
.prose figure.sm img{max-width:min(340px,100%)}
.prose figure.polaroid img{border:10px solid #fdfcf8;border-bottom-width:38px;border-radius:3px;transform:rotate(-1.4deg);max-width:min(420px,100%)}
.prose figure.polaroid img:hover{transform:rotate(0) scale(1.02)}
.prose .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:2.2em 0}
.prose .gallery figure{margin:0}
.prose .img-fallback{display:block;margin:2em 0;padding:1.6em;border:1px dashed var(--rule);border-radius:10px;text-align:center;color:var(--ink-soft);font-size:14px}

.prose ul,.prose ol{margin:0 0 1.4em;padding-left:1.7em;font-size:var(--fs);line-height:1.8;letter-spacing:.5px}
.prose li{margin:.35em 0;padding-left:.2em}
.prose li::marker{color:var(--accent-read)}
.prose .table-wrap{margin:1.8em 0;overflow-x:auto}
.prose table{width:100%;border-collapse:collapse;font-size:calc(var(--fs) - 2px);line-height:1.6;letter-spacing:0}
.prose th,.prose td{padding:.6em .9em;text-align:left;border-bottom:1px solid var(--rule)}
.prose th{font-weight:700;color:var(--accent-read);border-bottom:2px solid var(--accent-read);white-space:nowrap}
.prose details{margin:1.8em 0;padding:.1em 1.2em;border:1px solid var(--rule);border-radius:12px;background:var(--chip)}
.prose summary{cursor:pointer;padding:.8em 0;font-weight:700;color:var(--accent-read);letter-spacing:.1em}
.prose details[open] summary{border-bottom:1px solid var(--rule);margin-bottom:.9em}

.prose .rv{opacity:0;transform:translateY(18px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.prose .rv.rv-in{opacity:1;transform:none}

.lightbox{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:rgba(0,0,0,.9);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .25s ease;cursor:zoom-out}
.lightbox.open{opacity:1}
.lightbox img{max-width:94vw;max-height:80vh;object-fit:contain;border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:scale(.96);transition:transform .35s var(--ease)}
.lightbox.open img{transform:none}
.lb-cap{margin:0;max-width:80ch;color:#cfc8b8;font-size:14px;letter-spacing:.1em;line-height:1.7;text-align:center}

.pager{display:flex;gap:14px;margin-top:40px;padding-top:28px;border-top:1px solid var(--rule)}
.pager-btn{
  flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; padding:14px 18px; cursor:pointer;
  border-radius:14px; border:1px solid var(--rule); background:var(--chip); color:var(--ink);
  font-family:var(--font-serif); transition:background .2s ease,transform .2s ease;
}
.pager-btn:hover:not(:disabled){background:var(--chip-hover);transform:translateY(-2px)}
.pager-btn:disabled{opacity:.35;cursor:not-allowed}
.toast{
  position:fixed; left:50%; bottom:max(28px,env(safe-area-inset-bottom)); z-index:400; max-width:calc(100vw - 40px);
  padding:10px 20px; border-radius:999px; font-size:14px; letter-spacing:.12em; white-space:nowrap;
  color:#f3ead2; background:rgba(20,20,22,.82); border:1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); box-shadow:0 10px 30px rgba(0,0,0,.4);
  opacity:0; transform:translate(-50%,12px); pointer-events:none; transition:opacity .35s ease,transform .35s var(--ease);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.pager-btn.prev{text-align:left}
.pager-btn.next{text-align:right}
.pager-dir{font-size:13px;letter-spacing:.2em;color:var(--accent-read);font-weight:600}
.pager-name{font-size:16px;line-height:1.5;color:var(--ink);overflow-wrap:anywhere;white-space:normal}   /* 章名完整顯示，過長時換行 */
.pager-btn:disabled .pager-dir{color:var(--ink-soft)}

@media (max-width:600px){
  .nav-inner{padding-left:12px;padding-right:12px;gap:6px}
  .nav-right{gap:6px}
  .chapter-panel{right:12px}
  .chip-btn{padding:0 11px;font-size:13px}
  .reader-main{padding:0 20px}
  .reader-column{padding:40px 0 72px}
  .cover-card{padding:20px}
}
@media (max-width:440px){
  .fs-value{display:none}
  .dd-icon{display:none}
}
/* =====================================================
   系列：書架銘牌、系列頁、主題封面
   ===================================================== */
.shelf-books{gap:34px}
.shelf-group{display:flex;flex-direction:column;align-items:center}
.shelf-group-books{display:flex;align-items:flex-end;gap:6px}
.series-plate{
  margin:0 0 68px; padding:9px 20px; max-width:100%; border:0; border-radius:6px; cursor:pointer; white-space:nowrap;   /* 與書背留出空間：書被點選上浮時不會壓到銘牌 */
  font-family:var(--font-serif); font-weight:700; font-size:calc(12px*var(--k) + 2px); letter-spacing:.2em;
  color:#2a1d05; background:linear-gradient(180deg,#f3df9a,#c9a44c 55%,#93702a);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.55);
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),filter .35s ease;
}
.series-plate:focus-visible{outline:2px solid #f0d98c;outline-offset:3px}
.shelf-scroller:has(.series-plate){padding-top:24px}   /* 銘牌已占掉上方的空間，書架頂端的留白可以縮小 */
@media (hover:hover){
  .series-plate:hover{transform:translateY(-3px);filter:brightness(1.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.25),0 14px 26px rgba(0,0,0,.6),0 0 30px rgba(240,200,110,.4)}
}
.spine-orn{font-family:var(--font-serif);font-weight:700}

.cover-art{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cover-art svg{
  position:absolute; top:0; left:50%; height:100%; width:auto; aspect-ratio:2/3; transform:translateX(-50%); opacity:.7;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent); mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent);
  animation:artBreath 26s ease-in-out infinite alternate;
}
.cover-art::after{
  content:""; position:absolute; inset:0;
  background:radial-gradient(ellipse at 50% 38%,transparent 0,rgba(12,12,14,.35) 62%,rgba(12,12,14,.85) 100%),linear-gradient(180deg,rgba(12,12,14,.1),rgba(12,12,14,.6));
}
@keyframes artBreath{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.06)}}
/* 閱讀器：第一章上方的書本圖片。寬度與下方文字欄（最寬 720px）左右對齊，過高的圖限制在 80% 螢幕高度內 */
.book-hero{margin:-28px 0 56px;padding:0;line-height:0}
/* 框就是圖本身：寬高以圖的比例縮放，不留任何空白邊；太高的圖（最低保留 520px）超出時會等比縮小 */
.book-hero img{
  display:block; width:auto; height:auto; max-width:100%; max-height:80vh; max-height:max(80dvh,520px); margin:0 auto;
  border-radius:12px; cursor:zoom-in;
  box-shadow:0 1px 2px rgba(0,0,0,.3),0 8px 16px rgba(0,0,0,.28),0 22px 44px rgba(0,0,0,.34),0 46px 90px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.22);
  opacity:0; transform:scale(.985); transition:opacity .9s ease,transform 1.1s var(--ease);
}
.book-hero img.loaded{opacity:1;transform:none}
:root[data-theme="night"] .book-hero img{
  filter:brightness(.9);
  box-shadow:0 1px 2px rgba(0,0,0,.8),0 10px 22px rgba(0,0,0,.8),0 30px 70px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.12),0 0 60px rgba(212,176,106,.08);
}
@media (max-width:600px){.book-hero{margin:-16px 0 40px}}
.cover-en{margin:14px 0 0;font-family:var(--font-serif);font-size:clamp(12px,2vw,16px);letter-spacing:.3em;padding-left:.3em;color:#b9b2a2}
.cover-sub{margin-top:14px}
.cover-synopsis p{margin:0 0 .9em}
.cover-synopsis p:last-child{margin-bottom:0}
.cover-view.active .cover-en{animation:rise .9s .06s var(--ease) both}
.btn-read.is-soon{animation:none;opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.series-link{
  margin-top:18px; padding:8px 18px; border-radius:999px; cursor:pointer; font-family:var(--font-serif); font-size:13px; letter-spacing:.2em;
  color:rgb(var(--accent-rgb)); background:transparent; border:1px solid rgba(var(--accent-rgb),.3);
  transition:background .25s ease,border-color .25s ease;
}
.series-link:hover{background:rgba(var(--accent-rgb),.1);border-color:rgba(var(--accent-rgb),.6)}

.series-view{
  position:relative; min-height:100vh; min-height:100dvh; overflow:hidden; padding:88px 24px 80px;
  background:
    radial-gradient(90% 50% at 50% 0%,rgba(217,178,95,.17),transparent 70%),
    radial-gradient(50% 36% at 90% 85%,rgba(91,141,224,.09),transparent 70%),
    radial-gradient(46% 34% at 8% 60%,rgba(52,168,130,.07),transparent 70%),
    #0a0a0c;
}
.series-stars{
  position:absolute; inset:0; pointer-events:none; opacity:.75;
  background-image:
    radial-gradient(1px 1px at 22px 34px,#f4ecd0,transparent),radial-gradient(1px 1px at 96px 150px,#fff,transparent),
    radial-gradient(1.4px 1.4px at 210px 62px,#f4ecd0,transparent),radial-gradient(1px 1px at 280px 210px,#fff,transparent),
    radial-gradient(1px 1px at 150px 262px,#f4ecd0,transparent),radial-gradient(1.2px 1.2px at 336px 118px,#fff,transparent),
    radial-gradient(1px 1px at 60px 300px,#f4ecd0,transparent),radial-gradient(1px 1px at 250px 330px,#fff,transparent);
  background-size:380px 360px;
}
.series-inner{position:relative;max-width:1080px;margin:0 auto}
.series-head{text-align:center}
.series-eyebrow{margin:0 0 18px;font-size:12px;letter-spacing:.6em;padding-left:.6em;color:#8d877a}
.series-title{
  margin:0; font-family:var(--font-serif); font-weight:700; line-height:1.15;
  font-size:clamp(40px,9vw,88px); letter-spacing:.1em; padding-left:.1em;
  background:linear-gradient(180deg,#fff6d8 0%,#d9b25f 55%,#a47a2a 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 8px 28px rgba(217,178,95,.3));
}
.series-en{margin:16px 0 0;font-family:var(--font-serif);font-size:clamp(13px,2.2vw,18px);letter-spacing:.34em;padding-left:.34em;color:#b9b2a2}
.series-desc{
  max-width:720px; margin:44px auto 0; padding:26px 30px; border-radius:18px;
  background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  font-family:var(--font-serif); color:#cdc7b9; line-height:2; font-size:16px; letter-spacing:.04em;
}
.series-desc p{margin:0 0 1em}
.series-desc p:last-child{margin-bottom:0}
.series-desc p:first-child{font-size:1.08em;color:#e8e1cd}
.series-quote{
  max-width:700px; margin:44px auto 0; padding:0 8px; border:0; text-align:center;
  font-family:var(--font-serif); font-weight:600; font-size:clamp(19px,3.2vw,26px); line-height:1.8; letter-spacing:.1em; color:#e3c77b;
}
.series-quote::before{content:"❝";display:block;font-size:2.2em;line-height:.7;opacity:.4;margin-bottom:.25em}
.series-divider{display:flex;align-items:center;gap:18px;margin:64px auto 40px;max-width:520px;color:#8d877a;font-size:13px;letter-spacing:.5em}
.series-divider::before,.series-divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(217,178,95,.45))}
.series-divider::after{background:linear-gradient(270deg,transparent,rgba(217,178,95,.45))}
.series-divider span{padding-left:.5em}
.series-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:34px;justify-items:center}

.book-card{
  --ac:217,178,95; display:flex; flex-direction:column; gap:16px; width:100%; max-width:340px; padding:0; border:0; background:none;
  cursor:pointer; text-align:left; color:inherit; font-family:var(--font-serif);
}
.book-card[data-color="emerald"]{--ac:52,168,130}
.book-card[data-color="sapphire"]{--ac:91,141,224}
.book-card[data-color="crimson"]{--ac:212,88,106}
.poster{
  position:relative; width:100%; aspect-ratio:2/3; border-radius:10px; overflow:hidden;
  background:radial-gradient(90% 70% at 50% 0%,rgba(var(--ac),.5),#0d0d10);
  box-shadow:0 22px 44px rgba(0,0,0,.6),0 0 0 1px rgba(var(--ac),.28),inset 0 0 0 1px rgba(255,255,255,.06);
  transition:transform .5s var(--ease),box-shadow .5s var(--ease);
}
.poster svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.poster::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.34) 0,transparent 24%,transparent 50%,rgba(0,0,0,.82) 100%)}
.poster-vol{
  position:absolute; z-index:1; top:16px; left:16px; padding:4px 12px; border-radius:999px; font-size:12px; letter-spacing:.3em;
  color:rgb(var(--ac)); background:rgba(0,0,0,.45); border:1px solid rgba(var(--ac),.5);
  -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
}
.poster-text{position:absolute;z-index:1;left:20px;right:20px;bottom:22px}
.poster-title{margin:0;font-size:24px;font-weight:700;line-height:1.3;letter-spacing:.08em;color:#fbf3da;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.poster-sub{margin:8px 0 0;font-size:14px;letter-spacing:.3em;color:rgb(var(--ac))}
.card-meta{padding:0 4px}
.card-en{margin:0 0 8px;font-size:13px;letter-spacing:.12em;line-height:1.6;color:#a8a191}
.card-status{margin:0;font-size:13px;letter-spacing:.14em;color:rgb(var(--ac))}
.card-status.soon{color:#8d877a}
.book-card:focus-visible{outline:none}
.book-card:focus-visible .poster{box-shadow:0 0 0 3px rgba(var(--ac),.9),0 22px 44px rgba(0,0,0,.6)}
.book-card:active .poster{transform:scale(.985)}
@media (hover:hover){
  .book-card:hover .poster{transform:translateY(-8px);box-shadow:0 34px 60px rgba(0,0,0,.65),0 0 48px rgba(var(--ac),.4),0 0 0 1px rgba(var(--ac),.55)}
}
.series-view.active .series-head{animation:rise .9s var(--ease) both}
.series-view.active .series-desc{animation:rise .9s .15s var(--ease) both}
.series-view.active .series-quote{animation:rise .9s .25s var(--ease) both}
.series-view.active .book-card{animation:rise .9s var(--ease) both}
@media (max-width:600px){
  .series-view{padding:80px 18px 60px}
  .series-desc{padding:20px}
  .series-grid{gap:44px}
}
/* =====================================================
   J PORTAL：書架標題、點書動畫、特效畫布
   ===================================================== */
.shelf-title{font-size:clamp(28px,7vw,56px);letter-spacing:.3em;padding-left:.3em;line-height:1.1}
.shelf-zh{margin:14px 0 0;font-family:var(--font-serif);font-size:clamp(14px,2.4vw,18px);letter-spacing:.55em;padding-left:.55em;color:#cdbd8e}
.shelf-tagline{
  display:flex; align-items:center; justify-content:center; gap:14px; margin:14px 0 0;
  font-family:var(--font-serif); font-size:clamp(10px,1.6vw,12px); letter-spacing:.5em; color:#857f72;
}
.shelf-tagline:empty{display:none}
.shelf-tagline::before,.shelf-tagline::after{content:"";width:clamp(18px,5vw,40px);height:1px;background:linear-gradient(90deg,transparent,rgba(217,178,95,.55))}
.shelf-tagline::after{background:linear-gradient(270deg,transparent,rgba(217,178,95,.55))}

.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
.fx-front{z-index:6}

/* 點書：先播完上浮動畫，其他書同時變暗，再進入（電腦與手機一致） */
.spine,.series-plate{transition:transform .5s var(--ease),box-shadow .5s var(--ease),filter .5s ease}
.spine.is-picked{
  transform:translateY(-24px) scale(1.07); z-index:4; filter:brightness(1.18);
  box-shadow:inset 3px 0 5px rgba(255,255,255,.22),inset -5px 0 9px rgba(0,0,0,.4),0 30px 38px rgba(0,0,0,.65),0 0 56px var(--glow);
}
.is-picking .spine:not(.is-picked){filter:brightness(.45) saturate(.6);transform:scale(.985)}
.series-plate.is-picked{transform:translateY(-4px) scale(1.07);filter:brightness(1.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.25),0 16px 28px rgba(0,0,0,.6),0 0 40px rgba(240,200,110,.55)}
.is-picking .series-plate:not(.is-picked){filter:brightness(.5)}
.book-card{transition:opacity .5s ease,filter .5s ease}
.book-card.is-picked .poster{transform:translateY(-12px) scale(1.035);box-shadow:0 38px 64px rgba(0,0,0,.66),0 0 64px rgba(var(--ac),.55),0 0 0 1px rgba(var(--ac),.7)}
.is-picking .book-card:not(.is-picked){opacity:.32;filter:saturate(.5)}
.is-picking *{pointer-events:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<body data-view="shelf">

<!-- ========== 第一層：書架 ========== -->
<div id="shelfView" class="view shelf-view active">
  <div class="ambient" aria-hidden="true"></div>
  <canvas class="fx fx-back" id="fxBack" aria-hidden="true"></canvas>
  <header class="shelf-head">
    <h1 class="shelf-title" id="siteTitle">J PORTAL</h1>
    <p class="shelf-zh" id="siteZh"></p>
    <p class="shelf-tagline" id="siteTagline"></p>
  </header>
  <section class="shelf-stage" aria-label="書架">
    <div class="shelf-scroller" id="shelfScroller">
      <div class="shelf-inner">
        <div class="shelf-books" id="shelfRow">
          <p class="shelf-status" id="shelfStatus">書架整理中…</p>
        </div>
        <div class="shelf-board" aria-hidden="true"></div>
      </div>
    </div>
    <p class="shelf-hint" id="shelfHint" hidden>← 左右滑動，瀏覽更多書籍 →</p>
  </section>
  <canvas class="fx fx-front" id="fxFront" aria-hidden="true"></canvas>
</div>

<!-- ========== 第二層：封面 ========== -->
<section id="coverView" class="view cover-view" data-color="gold" hidden aria-label="書籍封面">
  <div class="cover-art" id="coverArt" aria-hidden="true"></div>
  <button type="button" class="back-link" id="coverBack">← 回書架</button>
  <div class="cover-inner">
    <h2 class="cover-title" id="coverTitle"></h2>
    <p class="cover-en" id="coverEn"></p>
    <p class="cover-sub" id="coverSub"></p>
    <hr class="cover-rule">
    <p class="cover-author" id="coverAuthor"></p>
    <div class="cover-card" id="coverCard"><div class="cover-synopsis" id="coverSynopsis"></div></div>
    <button type="button" class="btn-read" id="readBtn">開始閱讀</button>
    <button type="button" class="series-link" id="coverSeries" hidden></button>
    <p class="cover-msg" id="coverMsg" role="status" aria-live="polite"></p>
  </div>
</section>

<!-- ========== 系列頁 ========== -->
<section id="seriesView" class="view series-view" hidden aria-label="系列介紹">
  <div class="series-stars" id="seriesStars" aria-hidden="true"></div>
  <button type="button" class="back-link" id="seriesBack">← 回書架</button>
  <div class="series-inner">
    <header class="series-head">
      <p class="series-eyebrow">SERIES</p>
      <h2 class="series-title" id="seriesTitle"></h2>
      <p class="series-en" id="seriesEn"></p>
    </header>
    <div class="series-desc" id="seriesDesc"></div>
    <blockquote class="series-quote" id="seriesQuote" hidden></blockquote>
    <div class="series-divider"><span>收錄作品</span></div>
    <div class="series-grid" id="seriesGrid"></div>
  </div>
</section>

<!-- ========== 第三層：閱讀器 ========== -->
<div id="readerView" class="view reader-view" hidden>
  <header class="reader-nav">
    <div class="nav-inner">
      <button type="button" class="chip-btn btn-home" id="homeBtn">🏠 回書架</button>
      <div class="nav-right">
        <div class="dropdown" id="chapterDropdown">
          <button type="button" class="chip-btn dd-toggle" id="chapterToggle" aria-expanded="false" aria-controls="chapterPanel">
            <span class="dd-icon" aria-hidden="true">☰</span>
            <span class="dd-label" id="chapterLabel">章節</span>
            <span class="dd-caret" aria-hidden="true">▾</span>
          </button>
          <div class="chapter-panel" id="chapterPanel" hidden>
            <div class="panel-head" id="panelHead"></div>
            <ul class="chapter-list" id="chapterList"></ul>
          </div>
        </div>
        <div class="font-ctl" role="group" aria-label="字型大小">
          <button type="button" class="chip-btn icon-btn" id="fsDec" aria-label="縮小字型">A-</button>
          <span class="fs-value" id="fsValue" aria-live="polite">19</span>
          <button type="button" class="chip-btn icon-btn" id="fsInc" aria-label="放大字型">A+</button>
        </div>
        <button type="button" class="chip-btn icon-btn" id="themeBtn" aria-label="切換護眼／深夜模式">🌙</button>
      </div>
    </div>
    <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
  </header>

  <main class="reader-main">
    <div class="reader-column">
      <article class="chapter" id="chapterWrap">
        <figure class="book-hero" id="bookHero" hidden><img id="heroImg" alt="" decoding="async"></figure>
        <p class="chapter-kicker" id="chapterKicker"></p>
        <h1 class="chapter-title" id="chapterTitle"></h1>
        <div class="prose" id="prose"></div>
      </article>
      <nav class="pager" aria-label="章節切換">
        <button type="button" class="pager-btn prev" id="prevBtn">
          <span class="pager-dir" id="prevDir">← 上一章</span><span class="pager-name" id="prevName">—</span>
        </button>
        <button type="button" class="pager-btn next" id="nextBtn">
          <span class="pager-dir" id="nextDir">下一章 →</span><span class="pager-name" id="nextName">—</span>
        </button>
      </nav>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-label="圖片檢視">
  <img alt="">
  <p class="lb-cap" id="lbCap" hidden></p>
</div>

<script>
(() => {
  'use strict';

  /* ================= 常數與工具 ================= */
  const FS_MIN = 15, FS_MAX = 30, FS_DEFAULT = 19;
  const SPINE_COLORS = ['gold', 'emerald', 'sapphire', 'crimson'];
  const KEY = { fs: 'reader.fontSize', theme: 'reader.theme', progress: 'reader.progress', pos: 'reader.position' };

  const $ = (sel, root = document) => root.querySelector(sel);
  const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
  const escapeHtml = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hash = str => { let h = 0; for (const ch of String(str)) h = (h * 31 + ch.codePointAt(0)) >>> 0; return h; };

  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
      catch { return fallback; }
    },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* 隱私模式等情況：忽略 */ } }
  };

  const el = {
    body: document.body,
    root: document.documentElement,
    views: { shelf: $('#shelfView'), series: $('#seriesView'), cover: $('#coverView'), reader: $('#readerView') },
    heroFig: $('#bookHero'), heroImg: $('#heroImg'), coverArt: $('#coverArt'), coverEn: $('#coverEn'), coverSeries: $('#coverSeries'),
    seriesBack: $('#seriesBack'), seriesStars: $('#seriesStars'), seriesTitle: $('#seriesTitle'), seriesEn: $('#seriesEn'),
    seriesDesc: $('#seriesDesc'), seriesQuote: $('#seriesQuote'), seriesGrid: $('#seriesGrid'),
    siteTitle: $('#siteTitle'), siteZh: $('#siteZh'), siteTagline: $('#siteTagline'),
    scroller: $('#shelfScroller'), shelfRow: $('#shelfRow'), shelfHint: $('#shelfHint'),
    coverTitle: $('#coverTitle'), coverSub: $('#coverSub'), coverAuthor: $('#coverAuthor'),
    coverCard: $('#coverCard'), coverSynopsis: $('#coverSynopsis'), coverMsg: $('#coverMsg'),
    coverBack: $('#coverBack'), readBtn: $('#readBtn'),
    homeBtn: $('#homeBtn'), dropdown: $('#chapterDropdown'), chapterToggle: $('#chapterToggle'),
    chapterLabel: $('#chapterLabel'), chapterPanel: $('#chapterPanel'), panelHead: $('#panelHead'), chapterList: $('#chapterList'),
    fsDec: $('#fsDec'), fsInc: $('#fsInc'), fsValue: $('#fsValue'), themeBtn: $('#themeBtn'),
    progressBar: $('#progressBar'),
    chapterWrap: $('#chapterWrap'), chapterKicker: $('#chapterKicker'), chapterTitle: $('#chapterTitle'), prose: $('#prose'),
    prevBtn: $('#prevBtn'), nextBtn: $('#nextBtn'), prevName: $('#prevName'), nextName: $('#nextName'), prevDir: $('#prevDir'), nextDir: $('#nextDir')
  };

  /* ================= 狀態 ================= */
  const state = {
    view: 'shelf',
    siteTitle: 'J PORTAL',
    siteZh: '',
    defaultAuthor: '',
    picking: false,     // 點書動畫播放中（鎖住點擊）
    books: [],
    items: [],          // 書架項目：{ series } 或 { books:[…] }
    series: null,       // 目前開啟的系列
    coverFrom: 'shelf', // 封面的返回位置
    book: null,
    chapters: [],       // [{ title, html }]
    chapterIndex: 0,
    fontSize: FS_DEFAULT,
    theme: 'parchment',
    loadingBook: false
  };
  const bookCache = new Map(); // bookId -> Promise<chapters>

  /* ================= 主題封面插畫（程式繪製的向量圖） =================
     config.json 的書籍可指定 "theme": "egypt" | "siam" | "aurora"。
     想新增主題：在 ART 加一個產生 SVG 字串的函式，並在 THEME_COLOR 指定預設書背色即可。 */
  const THEME_COLOR = { egypt: 'gold', siam: 'emerald', aurora: 'sapphire' };
  let artSeq = 0;
  const nextUid = () => `art${++artSeq}-`;            // 每張圖用獨立 id，避免多張 SVG 的 gradient id 互相衝突
  const SVG_OPEN = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">';

  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function starField(seed, n, w, maxY, color = '#fff') {
    const r = rng(seed); let s = '';
    for (let i = 0; i < n; i++) {
      s += `<circle cx="${(r() * w).toFixed(1)}" cy="${(r() * maxY).toFixed(1)}" r="${(.4 + r() * 1.1).toFixed(2)}" fill="${color}" opacity="${(.25 + r() * .65).toFixed(2)}"/>`;
    }
    return s;
  }
  function glyphRow(seed, y, x0, x1, color) {
    const r = rng(seed); let s = '';
    for (let x = x0; x <= x1; x += 26) {
      const k = Math.floor(r() * 5);
      s += [
        `<circle cx="${x}" cy="${y}" r="6" fill="none" stroke="${color}" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="1.8" fill="${color}"/>`,
        `<path d="M${x - 6} ${y + 8}L${x} ${y - 9}L${x + 6} ${y + 8}Z" fill="none" stroke="${color}" stroke-width="1.5"/>`,
        `<path d="M${x} ${y - 9}V${y + 9}M${x - 6} ${y - 3}H${x + 6}" stroke="${color}" stroke-width="1.7" fill="none"/>`,
        `<path d="M${x - 7} ${y}Q${x} ${y - 10} ${x + 7} ${y}Q${x} ${y + 10} ${x - 7} ${y}Z" fill="none" stroke="${color}" stroke-width="1.4"/><circle cx="${x}" cy="${y}" r="2" fill="${color}"/>`,
        `<path d="M${x - 6} ${y - 8}V${y + 8}M${x + 6} ${y - 8}V${y + 8}M${x - 6} ${y}H${x + 6}" stroke="${color}" stroke-width="1.5" fill="none"/>`
      ][k];
    }
    return s;
  }

  const ART = {
    /* 埃及：夜空、落日、金字塔、尼羅河、抽象符號列 */
    egypt: p => {
      let ripples = '', glow = '';
      for (let i = 0; i < 11; i++) {
        const y = 436 + i * 14;
        ripples += `<path d="M0 ${y}q25 -4 50 0${' t50 0'.repeat(7)}" fill="none" stroke="#e9b45d" stroke-opacity="${(.2 - i * .012).toFixed(3)}" stroke-width="1.2"/>`;
      }
      for (let i = 0; i < 9; i++) {
        const w = 100 - i * 10;
        glow += `<rect x="${200 - w / 2}" y="${432 + i * 13}" width="${w}" height="2.4" rx="1.2" fill="#ffd98a" opacity="${(.72 - i * .07).toFixed(2)}"/>`;
      }
      return `${SVG_OPEN}<defs>
<linearGradient id="${p}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0703"/><stop offset=".5" stop-color="#34200f"/><stop offset=".74" stop-color="#b3722a"/><stop offset="1" stop-color="#f2c26b"/></linearGradient>
<radialGradient id="${p}g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".95"/><stop offset=".38" stop-color="#ffc45a" stop-opacity=".42"/><stop offset="1" stop-color="#ffb03a" stop-opacity="0"/></radialGradient>
<linearGradient id="${p}n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a24e"/><stop offset=".3" stop-color="#6b4217"/><stop offset="1" stop-color="#150b04"/></linearGradient>
</defs>
<rect width="400" height="600" fill="url(#${p}s)"/>
${starField(5, 70, 400, 250, '#ffe9bd')}
<g opacity=".5">${glyphRow(3, 84, 24, 380, '#e3b95f')}</g>
<line x1="20" y1="106" x2="380" y2="106" stroke="#e3b95f" stroke-opacity=".3"/>
<text x="200" y="262" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="190" font-weight="700" fill="#f0c96e" opacity=".17">J</text>
<circle cx="200" cy="388" r="170" fill="url(#${p}g)"/>
<circle cx="200" cy="388" r="50" fill="#ffe3a0"/>
<polygon points="30,420 128,308 226,420" fill="#2a180a"/><polygon points="128,308 226,420 128,420" fill="#150b05"/>
<polygon points="170,420 232,352 294,420" fill="#24140a"/><polygon points="232,352 294,420 232,420" fill="#120a04"/>
<polygon points="190,420 292,236 394,420" fill="#34200f"/><polygon points="292,236 394,420 292,420" fill="#150b05"/>
<polygon points="292,236 306,261 292,261" fill="#f2c26b" opacity=".35"/>
<rect x="0" y="420" width="400" height="180" fill="url(#${p}n)"/>
<line x1="0" y1="420" x2="400" y2="420" stroke="#ffd98a" stroke-opacity=".5"/>
${glow}${ripples}
<path d="M0 566Q100 540 200 560T400 548V600H0Z" fill="#0d0703"/></svg>`;
    },

    /* 暹羅：玉色夜空、月、金色光暈中的佛塔、叢林剪影與薄霧 */
    siam: p => {
      let fire = '';
      const r = rng(21);
      for (let i = 0; i < 26; i++) {
        fire += `<circle cx="${(r() * 400).toFixed(1)}" cy="${(300 + r() * 250).toFixed(1)}" r="${(.8 + r() * 1.6).toFixed(2)}" fill="#ffd98a" opacity="${(.3 + r() * .6).toFixed(2)}" filter="url(#${p}f)"/>`;
      }
      let trees = '';
      for (let i = 0; i < 16; i++) {
        const x = i * 27 - 10, h = 70 + ((i * 37) % 50);
        trees += `<ellipse cx="${x}" cy="${548 - h / 3}" rx="${24 + (i % 3) * 6}" ry="${h / 2}" fill="#041510"/>`;
      }
      return `${SVG_OPEN}<defs>
<linearGradient id="${p}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030d0b"/><stop offset=".5" stop-color="#0d3329"/><stop offset=".85" stop-color="#1d6a55"/><stop offset="1" stop-color="#2d8a6c"/></linearGradient>
<radialGradient id="${p}h" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd98a" stop-opacity=".7"/><stop offset=".45" stop-color="#e2a53f" stop-opacity=".22"/><stop offset="1" stop-color="#e2a53f" stop-opacity="0"/></radialGradient>
<radialGradient id="${p}m" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6d6" stop-opacity=".55"/><stop offset="1" stop-color="#fff6d6" stop-opacity="0"/></radialGradient>
<filter id="${p}f" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="1.6"/></filter>
<filter id="${p}b" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<g id="${p}t" fill="#05120e" stroke="#d9a84b" stroke-opacity=".45" stroke-width="1.2">
<polygon points="-92,0 92,0 72,-50 -72,-50"/><polygon points="-72,-50 72,-50 52,-96 -52,-96"/>
<polygon points="-52,-96 52,-96 34,-136 -34,-136"/><polygon points="-34,-136 34,-136 20,-172 -20,-172"/>
<polygon points="-20,-172 20,-172 9,-204 -9,-204"/><polygon points="-9,-204 9,-204 0,-300"/>
<path d="M0 -300V-326" fill="none" stroke-width="2"/><circle cx="0" cy="-330" r="3.5"/>
<path d="M-15 0V-24Q0 -42 15 -24V0Z" fill="#ffcf6e" stroke="none" opacity=".9"/>
</g>
</defs>
<rect width="400" height="600" fill="url(#${p}s)"/>
${starField(9, 46, 400, 220, '#dff7ec')}
<circle cx="316" cy="104" r="64" fill="url(#${p}m)"/><circle cx="316" cy="104" r="26" fill="#fff3cf"/>
<text x="84" y="190" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="120" font-weight="700" fill="#e2b85a" opacity=".16">J</text>
<circle cx="200" cy="340" r="220" fill="url(#${p}h)"/>
<use href="#${p}t" transform="translate(58 520) scale(.52)"/>
<use href="#${p}t" transform="translate(346 520) scale(.6)"/>
<use href="#${p}t" transform="translate(200 524)"/>
<ellipse cx="200" cy="500" rx="260" ry="34" fill="#9ed8c4" opacity=".28" filter="url(#${p}b)"/>
${fire}
${trees}
<ellipse cx="90" cy="540" rx="250" ry="30" fill="#b8e6d6" opacity=".22" filter="url(#${p}b)"/>
<ellipse cx="320" cy="560" rx="230" ry="26" fill="#b8e6d6" opacity=".18" filter="url(#${p}b)"/>
<rect x="0" y="560" width="400" height="40" fill="#02100c"/></svg>`;
    },

    /* 極光：星空、極光簾幕、冰原倒影、象徵時空／量子的同心環 */
    aurora: p => {
      let c1 = '', c2 = '';
      for (let x = -6; x <= 406; x += 5) {
        const y1 = 210 + 58 * Math.sin(x / 52) + 26 * Math.sin(x / 21 + 1.3);
        const h1 = 120 + 70 * Math.abs(Math.sin(x / 37 + .6));
        const y2 = 168 + 46 * Math.sin(x / 64 + 2.1) + 18 * Math.sin(x / 17);
        const h2 = 90 + 60 * Math.abs(Math.sin(x / 45 + 1.9));
        c1 += `<rect x="${x}" y="${y1.toFixed(1)}" width="5.4" height="${h1.toFixed(1)}" fill="url(#${p}g1)"/>`;
        c2 += `<rect x="${x}" y="${y2.toFixed(1)}" width="5.4" height="${h2.toFixed(1)}" fill="url(#${p}g2)"/>`;
      }
      const r = rng(11); let rings = '', dots = '';
      [34, 62, 96, 134, 176].forEach((rad, i) => {

        dots += `<circle cx="${(200 + rad * Math.cos(a)).toFixed(1)}" cy="${(250 + rad * Math.sin(a)).toFixed(1)}" r="2.4" fill="#d4f6ff" filter="url(#${p}b)"/>`;
      });
      return `${SVG_OPEN}<defs>
<linearGradient id="${p}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#01030a"/><stop offset=".55" stop-color="#071a30"/><stop offset="1" stop-color="#0d3345"/></linearGradient>
<linearGradient id="${p}g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dffc4" stop-opacity=".9"/><stop offset=".5" stop-color="#2ee6a8" stop-opacity=".32"/><stop offset="1" stop-color="#1aa0c0" stop-opacity="0"/></linearGradient>
<linearGradient id="${p}g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cc92ff" stop-opacity=".85"/><stop offset=".55" stop-color="#7a5cff" stop-opacity=".28"/><stop offset="1" stop-color="#3a4ad0" stop-opacity="0"/></linearGradient>

<filter id="${p}b" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="2.4"/></filter>
<filter id="${p}w" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.6"/></filter>

<text x="200" y="278" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="150" font-weight="700" fill="#bff3ff" opacity=".1">J</text>

<rect x="0" y="490" width="400" height="110" fill="url(#${p}l)"/>
<g clip-path="url(#${p}k)"><use href="#${p}c" transform="translate(0 740) scale(1 -.55)" opacity=".26"/></g>
<polygon points="0,492 40,456 86,480 140,428 192,472 252,424 312,470 352,446 400,472 400,492" fill="#040a14"/>
