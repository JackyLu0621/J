  function fillParagraphs(container, text) {
    container.replaceChildren();
    String(text || '').split(/\n+/).map(s => s.trim()).filter(Boolean).forEach(s => {
      const p = document.createElement('p'); p.textContent = s; container.appendChild(p);
    });
  }

  /* ================= 資料讀取 ================= */
  async function fetchRaw(url, label) {
    let res;
    try {
      res = await fetch(url, { cache: 'no-cache' });
    } catch {
      throw new Error(location.protocol === 'file:'
        ? `無法讀取 ${label}：瀏覽器不允許以 file:// 直接開啟網頁並讀取檔案。\n請改用本機伺服器（例如在資料夾內執行  python -m http.server  再開啟 http://localhost:8000），或上傳到網站空間後再開啟。`
        : `無法讀取 ${label}，請檢查網路連線與檔案路徑（${url}）。`);
    }
    if (!res.ok) throw new Error(`${label} 讀取失敗（HTTP ${res.status}，路徑：${url}）`);
    return res;
  }
  async function fetchJson(url, label) {
    const res = await fetchRaw(url, label);
    try { return await res.json(); }
    catch { throw new Error(`${label} 不是有效的 JSON，請檢查逗號與引號是否正確（路徑：${url}）。`); }
  }
  async function fetchText(url, label) {
    return (await fetchRaw(url, label)).text();
  }

  async function loadConfig() {
    const cfg = await fetchJson('config.json', 'config.json');
    if (!cfg || !Array.isArray(cfg.books)) throw new Error('config.json 格式錯誤：缺少 "books" 陣列。');
    const seen = new Set();
    const books = [];
    cfg.books.forEach(b => {
      if (!b || typeof b.id !== 'string' || typeof b.title !== 'string') {
        console.warn('略過格式不完整的書籍（需要 id、title）：', b); return;
      }
      if (seen.has(b.id)) { console.warn('略過重複的書籍 id：', b.id); return; }
      seen.add(b.id);
      const theme = ART[b.theme] ? b.theme : null;
      const color = SPINE_COLORS.includes(b.color) ? b.color
        : (theme && THEME_COLOR[theme]) || SPINE_COLORS[books.length % SPINE_COLORS.length];
      // 沒有 file，或標記為 status:"soon"，就是「即將推出」：不載入內文，按鈕停用
      const soon = b.status === 'soon' || typeof b.file !== 'string' || !b.file;
      books.push({ ...b, _color: color, _theme: theme, _soon: soon, _series: null });
    });

    // 系列：書籍以 "series": "<系列id>" 歸屬；系列內依 order（沒寫則依 config 順序）排列
    const series = (Array.isArray(cfg.series) ? cfg.series : [])
      .filter(s => s && typeof s.id === 'string' && typeof s.title === 'string')
      .map(s => {
        const list = books.filter(b => b.series === s.id)
          .sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));
        return { ...s, books: list };
      })
      .filter(s => s.books.length);
    series.forEach(s => s.books.forEach(b => { b._series = s; }));

    // 書架項目：系列自成一組（附銘牌），沒有系列的書依序併成一組
    const items = [], doneSeries = new Set();
    books.forEach(b => {
      if (b._series) {
        if (doneSeries.has(b._series.id)) return;
        doneSeries.add(b._series.id);
        items.push({ series: b._series });
      } else {
        const last = items[items.length - 1];
        if (last && last.books) last.books.push(b); else items.push({ books: [b] });
      }
    });
    return { site: cfg.site || {}, books, series, items };
  }

  /* 書籍檔 book.file 支援兩種格式（同一個 config.json 裡可以混用）：
     ① 整本在一個檔案：{ "chapters": { "章名": "<p>…</p>", … } }                      → 一次載入
     ② 一章一個檔案：  { "chapters": [ { "title": "章名", "file": "001.html" }, … ] }  → 目錄先載入，內文讀到才載入
        file 路徑相對於這個目錄檔本身；章節檔是 HTML 片段，第一行 <h1> 為章名。 */
  function normalizeChapters(data, baseUrl) {
    const src = data && typeof data === 'object' && data.chapters ? data.chapters : data;
    let list = [];
    if (Array.isArray(src)) {
      list = src.map((c, i) => {
        const file = c && typeof c.file === 'string' ? c.file.trim() : '';
        const hasTitle = c && c.title != null && String(c.title).trim() !== '';
        return {
          title: hasTitle ? String(c.title) : `第 ${i + 1} 章`,
          _auto: !hasTitle,                                   // 目錄沒寫章名：載入該章後改用檔案內的 <h1>
          url: file ? new URL(file, baseUrl).href : '',
          html: file ? '' : String(c && (c.content ?? c.html) != null ? (c.content ?? c.html) : ''),
          loaded: !file
        };
      });
    } else if (src && typeof src === 'object') {
      list = Object.entries(src).map(([title, html]) => ({ title, html: String(html ?? ''), url: '', loaded: true }));
    }
    if (!list.length) throw new Error('小說檔案中找不到任何章節（需要 "chapters" 物件或陣列）。');
    return list;
  }

  // 取得某一章的內文；一章一檔的書在這裡才真正下載（同一章只下載一次）
  function ensureChapter(index) {
    const ch = state.chapters[index];
    if (!ch) return Promise.reject(new Error('找不到這個章節。'));
    if (ch.loaded) return Promise.resolve(ch);
    if (!ch._p) {
      ch._p = fetchText(ch.url, `第 ${index + 1} 章「${ch.title}」`).then(text => {
        const tpl = document.createElement('template');
        tpl.innerHTML = text;
        const h1 = tpl.content.querySelector('h1');           // 章名在 <h1>，閱讀器自己會顯示章名，所以從內文拿掉
        if (h1) {
          const t = h1.textContent.trim();
          if (ch._auto && t) { ch.title = t; ch._auto = false; ch._titleChanged = true; }
          h1.remove();
        }
        ch.html = tpl.innerHTML;
        ch.loaded = true;
        return ch;
      });
      ch._p.catch(() => { ch._p = null; });                    // 失敗時允許重試
    }
    return ch._p;
  }

  // 在閒置時先載入下一章，翻頁時就不用等
  function prefetchChapter(index) {
    const ch = state.chapters[index];
    if (!ch || ch.loaded) return;
    const run = () => { ensureChapter(index).catch(() => {}); };
    if ('requestIdleCallback' in window) requestIdleCallback(run, { timeout: 3000 }); else setTimeout(run, 800);
  }

  function loadBook(book) {
    if (!bookCache.has(book.id)) {
      const baseUrl = new URL(book.file, document.baseURI).href;
      const p = fetchJson(book.file, `《${book.title}》內容檔`).then(d => normalizeChapters(d, baseUrl));
      p.catch(() => bookCache.delete(book.id)); // 失敗時允許重試
      bookCache.set(book.id, p);
    }
    return bookCache.get(book.id);
  }

  /* ---- 內文白名單：只允許這些標籤、屬性與 class ---- */
  const ALLOWED_TAGS = new Set(['p','br','strong','b','em','i','u','s','mark','span','sup','sub','small','ruby','rt','rp','code','kbd','pre','h2','h3','h4','hr','blockquote','div','aside','figure','figcaption','img','ul','ol','li','table','thead','tbody','tr','th','td','details','summary','a']);
  const DROP_TAGS = new Set(['script','style','iframe','object','embed','link','meta','base','form','input','button','textarea','select','svg','math','canvas','audio','video','template','noscript','title']);
  const ALLOWED_ATTRS = { img: ['src','alt','title'], a: ['href','title'], td: ['colspan','rowspan'], th: ['colspan','rowspan'], ol: ['start'], details: ['open'] };
  const ALLOWED_CLASSES = new Set([
    'c-red','c-orange','c-gold','c-green','c-teal','c-blue','c-purple','c-pink','c-gray',
    'm-gold','m-red','m-blue','m-green','m-purple',
    'big','small','spaced','glow','whisper','mono','center','right','indent','dropcap',
    'box','box-info','box-warn','box-danger','box-ok','box-secret','box-title','doc','terminal',
    'wide','sm','polaroid','gallery','line','star','pull','redact'
  ]);

  function isSafeUrl(value, { image = false } = {}) {
    const s = String(value).replace(/[\u0000- \u007f-\u009f]/g, '');
    if (!s) return false;
    const scheme = /^([a-z][a-z0-9+.-]*):/i.exec(s);
    if (!scheme) return true;                         // 相對路徑，例如 images/a.jpg
    const p = scheme[1].toLowerCase();
    if (p === 'http' || p === 'https') return true;
    return image && p === 'data' && /^data:image\/(png|jpe?g|gif|webp|avif);/i.test(s);
  }

  function sanitize(parent) {
    [...parent.childNodes].forEach(node => {
      if (node.nodeType === Node.TEXT_NODE) return;
      if (node.nodeType !== Node.ELEMENT_NODE) { node.remove(); return; }
      const tag = node.tagName.toLowerCase();
      if (DROP_TAGS.has(tag)) { node.remove(); return; }
      sanitize(node);                                  // 先清理子節點
      if (!ALLOWED_TAGS.has(tag)) { node.replaceWith(...node.childNodes); return; } // 未知標籤：保留文字、拿掉外殼
      const allowed = ALLOWED_ATTRS[tag] || [];
      [...node.attributes].forEach(attr => {
        const name = attr.name.toLowerCase();
        if (name === 'class') {
          const ok = attr.value.split(/\s+/).filter(c => ALLOWED_CLASSES.has(c));
          if (ok.length) node.setAttribute('class', ok.join(' ')); else node.removeAttribute('class');
        } else if (!allowed.includes(name)) {
          node.removeAttribute(attr.name);
        }
      });
      if (tag === 'img') {
        if (!isSafeUrl(node.getAttribute('src') || '', { image: true })) { node.remove(); return; }
        node.setAttribute('loading', 'lazy');
        node.setAttribute('decoding', 'async');
        if (!node.hasAttribute('alt')) node.setAttribute('alt', '');
      }
      if (tag === 'a') {
        if (isSafeUrl(node.getAttribute('href') || '')) {
          node.setAttribute('target', '_blank');
          node.setAttribute('rel', 'noopener noreferrer');
        } else node.removeAttribute('href');
      }
    });
  }

  /* 把章節內文轉成安全的 DocumentFragment */
  function prepareContent(raw) {
    let html = String(raw);
    if (!/<(p|div|figure|h[2-4]|ul|ol|blockquote|aside|table|details)[\s>]/i.test(html)) { // 容錯：純文字就依換行自動包成段落
      html = html.split(/\n+/).map(s => s.trim()).filter(Boolean).map(s => `<p>${escapeHtml(s)}</p>`).join('');
    }
    const tpl = document.createElement('template');
    tpl.innerHTML = html;
    sanitize(tpl.content);
    return tpl.content;
  }

  /* ---- 內文加強：揭曉黑條、表格捲動、捲動浮現 ---- */
  let revealObserver = null;
  function enhanceContent() {
    const root = el.prose;
    root.querySelectorAll('.redact').forEach(n => { n.tabIndex = 0; n.setAttribute('role', 'button'); n.title = '點擊揭曉'; });
    root.querySelectorAll('table').forEach(t => {
      const w = document.createElement('div'); w.className = 'table-wrap';
      t.replaceWith(w); w.appendChild(t);
    });
    if (revealObserver) { revealObserver.disconnect(); revealObserver = null; }
    if (!('IntersectionObserver' in window)) return;
    const nested = '.gallery, .box, .doc, .terminal, blockquote, details';
    const targets = [...root.querySelectorAll('figure, .box, .doc, .terminal, blockquote, h2, h3, .gallery, .table-wrap, details')]
      .filter(n => !n.parentElement.closest(nested));
    revealObserver = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting) { en.target.classList.add('rv-in'); revealObserver.unobserve(en.target); }
      });
    }, { rootMargin: '0px 0px -6% 0px' });
    targets.forEach(n => { n.classList.add('rv'); revealObserver.observe(n); });
  }

  /* ---- 圖片燈箱 ---- */
  const lb = { root: $('#lightbox'), img: $('#lightbox img'), cap: $('#lbCap') };
  function openLightbox(img) {
    const fig = img.closest('figure');
    const capEl = fig && fig.querySelector('figcaption');
    const text = (capEl && capEl.textContent.trim()) || img.alt || '';
    lb.img.src = img.currentSrc || img.src;
    lb.img.alt = img.alt;
    lb.cap.textContent = text; lb.cap.hidden = !text;
    lb.want = true;
    lb.root.hidden = false;
    requestAnimationFrame(() => { if (lb.want) lb.root.classList.add('open'); });
  }
  function closeLightbox() {
    if (lb.root.hidden) return;
    lb.want = false;
    lb.root.classList.remove('open');
    setTimeout(() => {
      if (!lb.want) { lb.root.hidden = true; lb.img.removeAttribute('src'); }
    }, 260);
  }

  /* ================= 書架特效（兩張畫布） =================
     後層 fxBack ：漂浮光點、流星（在書架後方）
     前層 fxFront：聚光束、光束內的塵埃、點書時的粒子（疊在書上，只用淡淡的加亮效果）
     只在書架頁執行；離開書架、分頁被切到背景時完全暫停；「減少動態效果」時只畫靜態畫面。 */
  const motionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const reduced = () => !!motionQuery.matches;
  const shelfStage = $('.shelf-stage');
  const COLOR_RGB = { gold: [217, 178, 95], emerald: [52, 168, 130], sapphire: [91, 141, 224], crimson: [212, 88, 106] };

  const fx = (() => {
    const host = el.views.shelf;
    const back = $('#fxBack'), front = $('#fxFront');
    const bctx = back.getContext('2d'), fctx = front.getContext('2d');
    const GOLD = [255, 228, 165], EMERALD = [120, 232, 190], SAPPHIRE = [140, 184, 255];
    const sprites = new Map();
    const par = { tx: 0, ty: 0, x: 0, y: 0 };             // 視差：目標值與平滑後的值（-1 ~ 1）
    let w = 0, h = 0, dpr = 1, running = false, raf = 0, last = 0, t = 0, nextStar = 0;
    let orbs = [], motes = [], stars = [], bursts = [];
    let cone = { cx: 0, top: -30, bottom: 400, hw: 300 };
    const rnd = (a, b) => a + Math.random() * (b - a);

    function sprite(rgb) {
      const key = rgb.join(',');
      let c = sprites.get(key);
      if (!c) {
        c = document.createElement('canvas'); c.width = c.height = 64;
        const g = c.getContext('2d');
        const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
        grd.addColorStop(0, `rgba(${key},1)`); grd.addColorStop(.25, `rgba(${key},.45)`); grd.addColorStop(1, `rgba(${key},0)`);
        g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
        sprites.set(key, c);
      }
      return c;
    }

    function populate() {
      const nOrb = clamp(Math.round(w * h / 28000), 22, 46);      // 低調：數量少、移動慢
      const nMote = clamp(Math.round(cone.hw * (cone.bottom - cone.top) / 4200), 24, 64);
      orbs = Array.from({ length: nOrb }, () => {
        const roll = Math.random();
        const c = roll < .72 ? GOLD : roll < .86 ? EMERALD : SAPPHIRE;
        return { x: Math.random() * w, y: Math.random() * h, z: rnd(.25, 1), r: rnd(1, 3), vx: rnd(-6, 6), vy: rnd(-9, -2),
                 ph: rnd(0, 6.28), sp: rnd(.4, 1.1), a: rnd(.35, .85), spr: sprite(c) };
      });
      motes = Array.from({ length: nMote }, () => ({ u: rnd(-1, 1), v: Math.random(), r: rnd(.6, 1.7), ph: rnd(0, 6.28), sp: rnd(.5, 1.4), vv: rnd(.006, .02) }));
    }

    function resize() {
      const nw = host.clientWidth, nh = host.clientHeight;
      if (!nw || !nh) return;                                    // 書架被隱藏時不處理
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const changed = nw !== w || nh !== h;
      w = nw; h = nh;
      [back, front].forEach(c => { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); });
      bctx.setTransform(dpr, 0, 0, dpr, 0, 0); fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const sr = el.scroller.getBoundingClientRect(), hr = host.getBoundingClientRect();
      cone = { cx: w / 2, top: -30, bottom: clamp(sr.bottom - hr.top - 34, h * .4, h), hw: Math.min(w * .46, 430) };
      if (changed || !orbs.length) populate();
      if (!running) render(0, false);
    }

    function spawnStar(delay = 0) {
      const ang = rnd(24, 36) * Math.PI / 180, sp = rnd(650, 950);
      stars.push({ x: rnd(w * .35, w * 1.05), y: rnd(-10, h * .32), vx: -Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                   len: rnd(110, 200), age: 0, max: rnd(.9, 1.4), d: delay });
    }

    function render(dt, animate) {
      par.x += (par.tx - par.x) * Math.min(1, dt * 3);
      par.y += (par.ty - par.y) * Math.min(1, dt * 3);

      /* ---- 後層：光點、流星 ---- */
      bctx.clearRect(0, 0, w, h);
      bctx.globalCompositeOperation = 'lighter';
      orbs.forEach(o => {
        if (animate) {
          o.x += (o.vx + Math.sin(t * o.sp + o.ph) * 5) * dt;
          o.y += (o.vy + Math.cos(t * o.sp * .8 + o.ph) * 4) * dt;
          if (o.y < -20) { o.y = h + 20; o.x = Math.random() * w; }
          if (o.x < -20) o.x = w + 20; else if (o.x > w + 20) o.x = -20;
        }
        const tw = .6 + .4 * Math.sin(t * o.sp * 1.6 + o.ph * 2);
        const s = o.r * 7 * (.6 + .4 * o.z);
        bctx.globalAlpha = o.a * tw * (.5 + .5 * o.z);
        bctx.drawImage(o.spr, o.x + par.x * 26 * o.z - s / 2, o.y + par.y * 18 * o.z - s / 2, s, s);
      });
      bctx.globalAlpha = 1;
      if (animate) {
        if (t >= nextStar) {
          spawnStar(); if (Math.random() < .15) spawnStar(.35);
          nextStar = t + rnd(6, 12);
        }
        stars = stars.filter(s => {
          if (s.d > 0) { s.d -= dt; return true; }
          s.age += dt; s.x += s.vx * dt; s.y += s.vy * dt;
          const k = s.age / s.max; if (k >= 1) return false;
          const a = k < .15 ? k / .15 : 1 - (k - .15) / .85;
          const sp = Math.hypot(s.vx, s.vy), tx = s.x - s.vx / sp * s.len, ty = s.y - s.vy / sp * s.len;
          const g = bctx.createLinearGradient(s.x, s.y, tx, ty);
          g.addColorStop(0, `rgba(255,248,225,${(a * .95).toFixed(3)})`);
          g.addColorStop(.25, `rgba(255,226,160,${(a * .35).toFixed(3)})`);
          g.addColorStop(1, 'rgba(255,226,160,0)');
          bctx.strokeStyle = g; bctx.lineWidth = 1.4; bctx.lineCap = 'round';
          bctx.beginPath(); bctx.moveTo(s.x, s.y); bctx.lineTo(tx, ty); bctx.stroke();
          bctx.globalAlpha = a; bctx.drawImage(sprite(GOLD), s.x - 8, s.y - 8, 16, 16); bctx.globalAlpha = 1;
          return true;
        });
      }

      /* ---- 前層：聚光束、塵埃、點書粒子 ---- */
      fctx.clearRect(0, 0, w, h);
      fctx.globalCompositeOperation = 'lighter';
      const breathe = .88 + .12 * Math.sin(t * .35);
      const cx = cone.cx + par.x * 10;
      [[1, .024], [.88, .024], [.76, .024], [.64, .024], [.52, .024], [.4, .024]].forEach(([k, a]) => {
        const hwTop = cone.hw * .1 * k, hwBot = cone.hw * k;
        const g = fctx.createLinearGradient(0, cone.top, 0, cone.bottom);
        g.addColorStop(0, `rgba(255,226,160,${(a * .4 * breathe).toFixed(4)})`);
        g.addColorStop(.35, `rgba(255,226,160,${(a * 1.5 * breathe).toFixed(4)})`);
        g.addColorStop(1, `rgba(255,226,160,${(a * .45 * breathe).toFixed(4)})`);
        fctx.fillStyle = g;
        fctx.beginPath();
        fctx.moveTo(cx - hwTop, cone.top); fctx.lineTo(cx + hwTop, cone.top);
        fctx.lineTo(cx + hwBot, cone.bottom); fctx.lineTo(cx - hwBot, cone.bottom);
        fctx.closePath(); fctx.fill();
      });
      const pool = fctx.createRadialGradient(cx, cone.bottom, 0, cx, cone.bottom, cone.hw);   // 光落在書架上的光池
      pool.addColorStop(0, `rgba(255,226,160,${(.09 * breathe).toFixed(4)})`); pool.addColorStop(1, 'rgba(255,226,160,0)');
      fctx.save(); fctx.translate(0, cone.bottom); fctx.scale(1, .12); fctx.translate(0, -cone.bottom);
      fctx.fillStyle = pool; fctx.fillRect(cx - cone.hw, cone.bottom - cone.hw, cone.hw * 2, cone.hw * 2); fctx.restore();

      motes.forEach(m => {
        if (animate) { m.v -= m.vv * dt; if (m.v < 0) { m.v = 1; m.u = rnd(-1, 1); } }
        const v = m.v, hwv = cone.hw * (.1 + .9 * v);
        const x = cx + (m.u + Math.sin(t * .5 * m.sp + m.ph) * .08) * hwv * .92;
        const y = cone.top + (cone.bottom - cone.top) * v + Math.cos(t * .4 * m.sp + m.ph) * 3;
        const tw = .55 + .45 * Math.sin(t * 1.3 * m.sp + m.ph);
        const a = clamp(.55 * (1 - Math.abs(m.u) * .55) * tw * Math.sin(Math.PI * Math.min(1, v)), 0, 1);
        fctx.fillStyle = `rgba(255,236,190,${a.toFixed(3)})`;
        fctx.beginPath(); fctx.arc(x, y, m.r, 0, 6.2832); fctx.fill();
      });

      bursts = bursts.filter(p => {
        p.age += dt; if (p.age >= p.life) return false;
        p.vx *= 1 - 1.6 * dt; p.vy = p.vy * (1 - 1.2 * dt) - 18 * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        const k = p.age / p.life, s = p.r * 6 * (1 - .4 * k);
        fctx.globalAlpha = Math.pow(1 - k, 1.6) * .95;
        fctx.drawImage(p.spr, p.x - s / 2, p.y - s / 2, s, s);
        return true;
      });
      fctx.globalAlpha = 1;
    }

    function frame(now) {
      if (!running) return;
      raf = requestAnimationFrame(frame);
      const dt = Math.min(.05, (now - last) / 1000 || .016);
      last = now; t += dt;
      render(dt, true);
    }

    function start() {
      if (running) return;
      resize();
      if (!w) return;
      if (reduced()) { render(0, false); return; }
      running = true; last = performance.now();
      if (!nextStar || nextStar < t) nextStar = t + rnd(2.5, 4.5);
      raf = requestAnimationFrame(frame);
    }
    function stop() { running = false; cancelAnimationFrame(raf); }

    // 點書時從書背噴出該書顏色的光點
    function burst(target, rgb) {
      if (!running || !rgb) return;
      const er = target.getBoundingClientRect(), hr = host.getBoundingClientRect();
      const left = er.left - hr.left, top = er.top - hr.top;
      const col = rgb.map(v => Math.round(v + (255 - v) * .35));
      const spr = sprite(col);
      for (let i = 0; i < 34; i++) {
        bursts.push({ x: left + rnd(0, er.width), y: top + rnd(0, Math.min(er.height * .15, 40)), vx: rnd(-55, 55), vy: -rnd(60, 200),
                      r: rnd(1.6, 4), age: 0, life: rnd(.8, 1.4), spr });
      }
      for (let i = 0; i < 12; i++) {
        const side = Math.random() < .5 ? -1 : 1;
        bursts.push({ x: left + (side < 0 ? 0 : er.width), y: top + rnd(0, er.height), vx: side * rnd(20, 90), vy: -rnd(10, 80),
                      r: rnd(1.4, 3), age: 0, life: rnd(.7, 1.2), spr });
      }
      if (bursts.length > 140) bursts.splice(0, bursts.length - 140);
    }

    // 視差：電腦靠滑鼠位置；手機靠書架橫向捲動，或（Android 等不需授權的裝置）靠裝置傾斜
    host.addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse' || !w) return;
      const r = host.getBoundingClientRect();
      par.tx = ((e.clientX - r.left) / w - .5) * 2; par.ty = ((e.clientY - r.top) / h - .5) * 2;
    });
    host.addEventListener('pointerleave', () => { par.tx = 0; par.ty = 0; });
    el.scroller.addEventListener('scroll', () => {
      const m = el.scroller.scrollWidth - el.scroller.clientWidth;
      if (m > 4) par.tx = (el.scroller.scrollLeft / m - .5) * 2;
    }, { passive: true });
    window.addEventListener('deviceorientation', e => {
      if (!running || e.gamma == null) return;
      par.tx = clamp(e.gamma / 25, -1, 1); par.ty = clamp(((e.beta == null ? 45 : e.beta) - 45) / 25, -1, 1);
    }, { passive: true });

    if ('ResizeObserver' in window) {
      let pending = false;
      const ro = new ResizeObserver(() => {
        if (pending) return; pending = true;
        requestAnimationFrame(() => { pending = false; resize(); });
      });
      ro.observe(host); ro.observe(el.scroller);
    } else window.addEventListener('resize', resize);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stop(); else if (state.view === 'shelf') start();
    });
    if (motionQuery.addEventListener) motionQuery.addEventListener('change', () => {
      if (state.view === 'shelf') { stop(); start(); }
    });

    return { start, stop, burst, resize };
  })();

  /* ---- 點選：先播完上浮動畫（其他書同時變暗、噴出光點），再進入 ---- */
  function pick(target, container, rgb, go) {
    if (state.picking) return;
    if (reduced()) { go(); return; }
    state.picking = true;
    target.classList.add('is-picked'); container.classList.add('is-picking');
    fx.burst(target, rgb);
    setTimeout(() => {
      go();
      setTimeout(() => {
        target.classList.remove('is-picked'); container.classList.remove('is-picking'); state.picking = false;
      }, 600);
    }, 520);
  }

  /* ================= 畫面切換（淡入淡出） ================= */
  let viewToken = 0;
  function showView(name) {
    const next = el.views[name];
    const all = Object.values(el.views);
    const cur = all.find(v => v.classList.contains('active'));
    if (cur === next) return;
    const token = ++viewToken;
    state.view = name;
    state.posReady = false;   // 切換期間不記錄閱讀位置

    const reveal = () => {
      if (token !== viewToken) return;
      all.forEach(v => { if (v !== next) { v.hidden = true; v.classList.remove('active'); } });
      el.body.dataset.view = name;
      next.hidden = false;
      window.scrollTo(0, 0);
      if (name === 'reader') { applyPendingRestore(); state.posReady = true; }
      requestAnimationFrame(() => requestAnimationFrame(() => { if (token === viewToken) next.classList.add('active'); }));
      if (name === 'shelf') { document.title = shelfTitle(); updateHint(); fx.start(); } else fx.stop();
    };

    if (cur) { cur.classList.remove('active'); setTimeout(reveal, 320); }
    else reveal();
  }

  /* ================= 第一層：書架 ================= */
  function renderShelf() {
    el.shelfRow.replaceChildren();
    if (!state.books.length) { setShelfStatus('書架目前是空的。請在 config.json 的 "books" 中加入書籍。'); return; }

    let n = 0;
    state.items.forEach(item => {
      const group = document.createElement('div');
      group.className = 'shelf-group';
      if (item.series) {
        const plate = document.createElement('button');
        plate.type = 'button'; plate.className = 'series-plate';
        plate.textContent = `${item.series.title}　›`;
        plate.setAttribute('aria-label', `開啟系列：${item.series.title}`);
        plate.addEventListener('click', () => pick(plate, shelfStage, COLOR_RGB.gold, () => openSeries(item.series)));
        group.appendChild(plate);
      }
      const row = document.createElement('div');
      row.className = 'shelf-group-books';
      (item.series ? item.series.books : item.books).forEach(book => row.appendChild(makeSpine(book, n++)));
      group.appendChild(row);
      el.shelfRow.appendChild(group);
    });
    updateHint();
  }

  function makeSpine(book, i) {
    const h = hash(book.id);
    const titleLen = [...book.title].length;
    const subLen = [...(book.subtitle || '')].length;
    const w = 72 + (h % 3) * 6;
    const height = Math.max(300 + (h % 4) * 14, 120 + Math.ceil(titleLen * 22 * 1.2)); // 書名越長，書背越高
    const avail = height - 120;

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `spine spine--${book._color}`;
    btn.style.setProperty('--w', w);
    btn.style.setProperty('--h', height);
    btn.style.setProperty('--tfs', clamp(Math.floor(avail / titleLen / 1.2), 14, 28));
    btn.style.setProperty('--sfs', clamp(Math.floor(avail / Math.max(1, subLen) / 1.2), 11, 15));
    btn.style.animationDelay = `${i * 80}ms`;
    btn.setAttribute('aria-label', `開啟《${book.title}》${[book.volume, book.subtitle].filter(Boolean).join(' ')}`);

    const face = document.createElement('span'); face.className = 'spine-face';
    const text = document.createElement('span'); text.className = 'spine-text';
    const t = document.createElement('span'); t.className = 'spine-title'; t.textContent = book.title;
    text.appendChild(t);
    if (book.subtitle) {
      const s = document.createElement('span'); s.className = 'spine-sub'; s.textContent = book.subtitle;
      text.appendChild(s);
    }
    face.appendChild(text);
    const orn = document.createElement('span'); orn.className = 'spine-orn'; orn.setAttribute('aria-hidden', 'true');
    orn.textContent = (book._series && book._series.mark) || '✦';

    btn.append(face, orn);
    btn.addEventListener('click', () => pick(btn, shelfStage, COLOR_RGB[book._color], () => openBook(book, 'shelf')));
    return btn;
  }

  /* ================= 系列頁 ================= */
  function progressText(book) {
    if (book._soon) return { text: '即將推出', soon: true };
    const p = getProgress(book.id);
    return { text: hasProgress(book) ? `已讀至第 ${p + 1} 章` : '尚未開始閱讀', soon: false };
  }

  function bookCard(book, i) {
    const card = document.createElement('button');
    card.type = 'button'; card.className = 'book-card'; card.dataset.color = book._color;
    card.style.animationDelay = `${150 + i * 130}ms`;
    card.setAttribute('aria-label', `開啟《${book.title}》${[book.volume, book.subtitle].filter(Boolean).join(' ')}`);

    const poster = document.createElement('div'); poster.className = 'poster';
    if (book._theme) poster.innerHTML = ART[book._theme](nextUid()); // 內容為程式內建的靜態 SVG，非來自設定檔
    if (book.volume) { const v = document.createElement('span'); v.className = 'poster-vol'; v.textContent = book.volume; poster.appendChild(v); }
    const pt = document.createElement('div'); pt.className = 'poster-text';
    const title = document.createElement('p'); title.className = 'poster-title'; title.textContent = book.title; pt.appendChild(title);
    if (book.subtitle) { const s = document.createElement('p'); s.className = 'poster-sub'; s.textContent = book.subtitle; pt.appendChild(s); }
    poster.appendChild(pt);

    const meta = document.createElement('div'); meta.className = 'card-meta';
    if (book.titleEn) { const en = document.createElement('p'); en.className = 'card-en'; en.textContent = book.titleEn; meta.appendChild(en); }
    const st = progressText(book);
    const status = document.createElement('p'); status.className = 'card-status' + (st.soon ? ' soon' : ''); status.textContent = st.text;
    meta.appendChild(status);

    card.append(poster, meta);
    card.addEventListener('click', () => pick(card, el.seriesGrid, COLOR_RGB[book._color], () => openBook(book, 'series')));
    return card;
  }

  function renderSeries(s) {
    el.seriesTitle.textContent = s.title;
    el.seriesEn.textContent = s.titleEn || ''; el.seriesEn.hidden = !s.titleEn;
    fillParagraphs(el.seriesDesc, s.synopsis); el.seriesDesc.hidden = !s.synopsis;
    el.seriesQuote.textContent = s.question ? String(s.question).replace(/^「|」$/g, '') : '';
    el.seriesQuote.hidden = !s.question;
    el.seriesGrid.replaceChildren(...s.books.map(bookCard));
  }

  function openSeries(s) {
    state.series = s;
    renderSeries(s);
    document.title = `${s.title} - ${state.siteTitle}`;
    showView('series');
  }

  function shelfTitle() {
    return state.siteZh ? `${state.siteTitle} － ${state.siteZh}` : state.siteTitle;
  }

  function setShelfStatus(message, isError = false) {
    el.shelfRow.replaceChildren();
    const p = document.createElement('p');
    p.className = 'shelf-status' + (isError ? ' is-error' : '');
    p.textContent = message;
    el.shelfRow.appendChild(p);
    updateHint();
  }

  function updateHint() {
    el.shelfHint.hidden = !(el.scroller.scrollWidth > el.scroller.clientWidth + 4);
  }

  /* ================= 第二層：封面 ================= */
  function setCoverMsg(msg) { el.coverMsg.textContent = msg || ''; }

  function getProgress(id) {
    const v = store.get(KEY.progress, {})[id];
    return Number.isInteger(v) && v >= 0 ? v : 0;
  }
  function saveProgress() {
    if (!state.book) return;
    const p = store.get(KEY.progress, {});
    p[state.book.id] = state.chapterIndex;
    store.set(KEY.progress, p);
  }

  /* ---- 章內閱讀位置 ----
     記錄「第幾章、第幾個段落、段落內走到多少比例」，而不是像素；
     所以換字級、換手機或視窗寬度改變後，仍能回到同一句話附近。 */
  function getPos(id) {
    const v = store.get(KEY.pos, {})[id];
    return v && Number.isInteger(v.i) && v.i >= 0 && Number.isInteger(v.p) ? v : null;
  }
  function setPos(id, pos) {
    const all = store.get(KEY.pos, {});
    all[id] = pos;
    store.set(KEY.pos, all);
  }
  function hasProgress(book) {
    if (getProgress(book.id) > 0) return true;
    const pos = getPos(book.id);
    return !!(pos && (pos.p > 0 || pos.o > 0.02));
  }
  const readLine = () => document.querySelector('.reader-nav').offsetHeight + 8;   // 視線：固定導覽列下方
  const docTop = node => { let y = 0; for (let n = node; n; n = n.offsetParent) y += n.offsetTop; return y; };

  function currentAnchor() {
    if (window.scrollY < 24) return { p: 0, o: 0 };
    const line = readLine(), kids = el.prose.children;
    for (let i = 0; i < kids.length; i++) {
      const r = kids[i].getBoundingClientRect();
      if (r.bottom > line) return { p: i, o: clamp((line - r.top) / Math.max(1, r.height), 0, 1) };
    }
    return { p: Math.max(0, kids.length - 1), o: 1 };
  }
  function scrollToAnchor(a) {
    const kids = el.prose.children;
    const target = kids[Math.min(a.p, kids.length - 1)];
    if (!target) return;
    window.scrollTo(0, Math.max(0, Math.round(docTop(target) + a.o * target.offsetHeight - readLine())));
  }
  function savePosition() {
    if (!state.posReady || state.view !== 'reader' || !state.book || !state.chapters.length) return;
    const a = currentAnchor();
    setPos(state.book.id, { i: state.chapterIndex, p: a.p, o: Number(a.o.toFixed(3)) });
  }

  let toastTimer = 0;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  // 進入閱讀器、畫面真正顯示之後才能量版面，所以由 showView 在切換完成時呼叫
  function applyPendingRestore() {
    const pos = state.pendingRestore;
    state.pendingRestore = null;
    if (!pos) return;
    const imgs = [...el.prose.querySelectorAll('img')];
    if (!el.heroFig.hidden) imgs.push(el.heroImg);                              // 第一章上方的書本圖片也會影響高度
    imgs.forEach(im => { im.loading = 'eager'; });                               // 圖片先載入，避免高度變動
    state.userMoved = false;
    const t0 = performance.now();
    const again = () => { if (!state.userMoved && performance.now() - t0 < 4000) scrollToAnchor(pos); };
    scrollToAnchor(pos);
    imgs.forEach(im => { if (!im.complete) im.addEventListener('load', again, { once: true }); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(again);   // 網頁字型載入後字高可能改變
    if (pos.p > 0 || pos.o > 0.05) toast('已回到上次閱讀的位置');
  }

  function updateReadLabel() {
    const b = state.book;
    const soon = !!(b && b._soon);
    el.readBtn.disabled = soon || state.loadingBook;
    el.readBtn.classList.toggle('is-soon', soon);
    el.readBtn.textContent = soon ? '敬請期待' : (b && hasProgress(b) ? '繼續閱讀' : '開始閱讀');
  }

  function openBook(book, from = 'shelf') {
    state.book = book;
    state.coverFrom = from === 'series' && book._series ? 'series' : 'shelf';
    el.views.cover.dataset.color = book._color;
    el.coverBack.textContent = state.coverFrom === 'series' ? '← 回系列' : '← 回書架';

    el.coverTitle.textContent = book.title;
    const len = [...book.title].length;   // 書名越長字級越小，避免在封面上被擠成多行
    el.coverTitle.style.fontSize = `min(${clamp(Math.floor(560 / len / 1.15), 32, 92)}px, ${(88 / len / 1.15).toFixed(2)}vw)`;
    el.coverEn.textContent = book.titleEn || ''; el.coverEn.hidden = !book.titleEn;

    const sub = [book.volume, book.subtitle].filter(Boolean).join('：');
    el.coverSub.textContent = sub; el.coverSub.hidden = !sub;
    const author = book.author || state.defaultAuthor;
    el.coverAuthor.textContent = author ? `作者　${author}` : ''; el.coverAuthor.hidden = !author;
    fillParagraphs(el.coverSynopsis, book.synopsis); el.coverCard.hidden = !book.synopsis;
    el.coverArt.innerHTML = book._theme ? ART[book._theme](nextUid()) : ''; // 靜態內建 SVG

    if (book._series) {
      el.coverSeries.textContent = `◈　所屬系列　${book._series.title}`;
      el.coverSeries.hidden = false;
    } else el.coverSeries.hidden = true;

    setCoverMsg('');
    updateReadLabel();
    document.title = `${book.title} - ${state.siteTitle}`;
    showView('cover');

    // 背景預先載入內文，點「開始閱讀」時通常已就緒
    if (!book._soon) loadBook(book).catch(err => { if (state.book === book) setCoverMsg(err.message); });
  }

  async function startReading() {
    const book = state.book;
    if (!book || book._soon || state.loadingBook) return;
    state.loadingBook = true;
    el.readBtn.disabled = true;
    el.readBtn.textContent = '載入中…';
    setCoverMsg('');
    try {
      const chapters = await loadBook(book);
      if (state.book !== book) return; // 讀取途中使用者已離開
      state.chapters = chapters;
      const saved = getProgress(book.id);
      const start = saved < chapters.length ? saved : 0;
      await ensureChapter(start);                 // 一章一檔時，先把要讀的那一章載入，才切換畫面
      if (state.book !== book) return;
      buildChapterMenu();
      renderChapter(start, { restore: true });
      showView('reader');
    } catch (err) {
      if (state.book === book) setCoverMsg(err.message);
    } finally {
      state.loadingBook = false;
      el.readBtn.disabled = false;
      updateReadLabel();
    }
  }

  /* ================= 第三層：閱讀器 ================= */
  function buildChapterMenu() {
    el.chapterList.replaceChildren();
    el.panelHead.textContent = `目錄　·　共 ${state.chapters.length} 章`;
    const frag = document.createDocumentFragment();
    state.chapters.forEach((c, i) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chapter-item'; b.dataset.index = i;
      const num = document.createElement('span'); num.className = 'num'; num.textContent = i + 1;
      const title = document.createElement('span'); title.textContent = c.title;
      b.append(num, title);
      li.appendChild(b); frag.appendChild(li);
    });
    el.chapterList.appendChild(frag);
    closeMenu();
  }

  function markActiveChapter() {
    [...el.chapterList.querySelectorAll('.chapter-item')].forEach(b => {
      const on = Number(b.dataset.index) === state.chapterIndex;
      b.classList.toggle('is-active', on);
      if (on) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
    });
  }

  // 選單按鈕只顯示「第X章」；目錄清單裡仍是完整章名
  // 把「第四章　四點鐘的車隊」拆成 { short: '第四章', rest: '四點鐘的車隊' }；沒有「第X章」前綴則 short 為空
  function splitTitle(title) {
    const t = String(title).trim();
    const m = t.match(/^第\s*[0-9０-９零〇一二三四五六七八九十百千兩两]+\s*[章回節节篇卷集部話话]/);
    if (!m) return { short: '', rest: t };
    return { short: m[0].replace(/\s+/g, ''), rest: t.slice(m[0].length).replace(/^[\s　:：－—\-·]+/, '') };
  }

  function chapterShort(title, index) {
    const t = String(title).trim();
    const m = t.match(/^第\s*[0-9０-９零〇一二三四五六七八九十百千兩两]+\s*[章回節节篇卷集部話话]/);
    if (m) return m[0].replace(/\s+/g, '');
    const first = t.split(/[\s　:：－—\-·]+/)[0];   // 「序章　開場」→「序章」
    return first && [...first].length <= 8 ? first : `第 ${index + 1} 章`;
  }

  function renderChapter(index, { restore = false } = {}) {
    const ch = state.chapters[index];
    if (!ch) return;
    state.chapterIndex = index;

    // 書本圖片（config.json 的 "image"）只放在第一章上方，一進閱讀器就看得到
    const heroSrc = state.book.image || '';
    if (el.heroImg.getAttribute('src') !== heroSrc) {
      state.heroFailed = false;
      el.heroImg.classList.remove('loaded');
      if (heroSrc) { el.heroImg.alt = state.book.title; el.heroImg.src = heroSrc; } else el.heroImg.removeAttribute('src');
    }
    el.heroFig.hidden = !(index === 0 && heroSrc && !state.heroFailed);

    el.chapterKicker.textContent = `第 ${index + 1} / ${state.chapters.length} 章`;
    el.chapterTitle.textContent = ch.title;
    el.prose.replaceChildren(prepareContent(ch.html));
    enhanceContent();
    el.chapterLabel.textContent = chapterShort(ch.title, index);

    el.chapterWrap.classList.remove('is-in');
    void el.chapterWrap.offsetWidth; // 重新觸發動畫
    el.chapterWrap.classList.add('is-in');

    const prev = state.chapters[index - 1], next = state.chapters[index + 1];
    // 上下章按鈕：第一行「← 第四章」，第二行完整章名；章名沒有「第X章」前綴時，第一行用「上一章／下一章」
    const fill = (btn, dirEl, nameEl, ch, i, arrow, fallback) => {
      btn.disabled = !ch;
      if (!ch) { dirEl.textContent = arrow(fallback); nameEl.textContent = '—'; return; }
      const { short, rest } = splitTitle(ch.title);
      dirEl.textContent = arrow(short || fallback);
      nameEl.textContent = short ? rest : ch.title;
      nameEl.hidden = !nameEl.textContent;
    };
    fill(el.prevBtn, el.prevDir, el.prevName, prev, index - 1, s => `← ${s}`, '上一章');
    fill(el.nextBtn, el.nextDir, el.nextName, next, index + 1, s => `${s} →`, '下一章');

    markActiveChapter();
    document.title = `${ch.title} - ${state.book.title}`;
    window.scrollTo(0, 0);
    updateProgressBar();
    saveProgress();

    // 從封面「繼續閱讀」進來時，回到上次在這一章讀到的位置；換章則從該章開頭
    const pos = getPos(state.book.id);
    state.pendingRestore = restore && pos && pos.i === index && (pos.p > 0 || pos.o > 0) ? pos : null;
    if (!state.pendingRestore) setPos(state.book.id, { i: index, p: 0, o: 0 });

    prefetchChapter(index + 1);
  }

  let chapterToken = 0;
  async function goChapter(index) {
    if (index < 0 || index >= state.chapters.length) return;
    const token = ++chapterToken;
    const ch = state.chapters[index];
    if (!ch.loaded) {
      const timer = setTimeout(() => el.chapterWrap.classList.add('is-loading'), 150);   // 載入超過 0.15 秒才顯示變淡
      try { await ensureChapter(index); }
      catch (err) { toast('這一章載入失敗，請稍後再試'); console.warn(err.message); return; }
      finally { clearTimeout(timer); el.chapterWrap.classList.remove('is-loading'); }
      if (token !== chapterToken) return;         // 載入途中使用者又點了別章
    }
    renderChapter(index);
    if (ch._titleChanged) { buildChapterMenu(); markActiveChapter(); }
  }

  /* ---- 章節下拉選單 ---- */
  function openMenu() {
    el.chapterPanel.hidden = false;
    el.chapterToggle.setAttribute('aria-expanded', 'true');
    const active = el.chapterList.querySelector('.is-active');
    if (active) el.chapterList.scrollTop = active.offsetTop - el.chapterList.clientHeight / 2 + active.offsetHeight / 2;
  }
  function closeMenu() {
    el.chapterPanel.hidden = true;
    el.chapterToggle.setAttribute('aria-expanded', 'false');
  }
  function toggleMenu() { el.chapterPanel.hidden ? openMenu() : closeMenu(); }

  /* ---- 字型大小 ---- */
  function setFontSize(n, persist = true) {
    const keep = state.posReady && state.view === 'reader' ? currentAnchor() : null;   // 調整字級後留在原本讀的那句
    state.fontSize = clamp(Math.round(Number(n) || FS_DEFAULT), FS_MIN, FS_MAX);
    el.root.style.setProperty('--fs', state.fontSize + 'px');
    if (keep) scrollToAnchor(keep);
    el.fsValue.textContent = state.fontSize;
    el.fsDec.disabled = state.fontSize <= FS_MIN;
    el.fsInc.disabled = state.fontSize >= FS_MAX;
    if (persist) store.set(KEY.fs, state.fontSize);
    updateProgressBar();
  }

  /* ---- 主題 ---- */
  function setTheme(theme, persist = true) {
    state.theme = theme === 'night' ? 'night' : 'parchment';
    el.root.dataset.theme = state.theme;
    const night = state.theme === 'night';
    el.themeBtn.textContent = night ? '☀️' : '🌙';
    el.themeBtn.setAttribute('aria-label', night ? '切換為羊皮紙護眼模式' : '切換為深夜模式');
    if (persist) store.set(KEY.theme, state.theme);
  }

  /* ---- 閱讀進度條 ---- */
  let ticking = false;
  function updateProgressBar() {
    if (state.view !== 'reader') return;
    const h = el.root;
    const max = h.scrollHeight - h.clientHeight;
    el.progressBar.style.transform = `scaleX(${max > 0 ? clamp(h.scrollTop / max, 0, 1) : 0})`;
  }
  let posTimer = 0;
  function onScroll() {
    clearTimeout(posTimer);
    posTimer = setTimeout(savePosition, 350);   // 停止捲動 0.35 秒後記錄位置
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; updateProgressBar(); });
  }

  /* ================= 事件綁定 ================= */
  function bindEvents() {
    el.coverBack.addEventListener('click', () => {
      if (state.coverFrom === 'series' && state.book && state.book._series) openSeries(state.book._series);
      else showView('shelf');
    });
    el.coverSeries.addEventListener('click', () => { if (state.book && state.book._series) openSeries(state.book._series); });
    el.seriesBack.addEventListener('click', () => showView('shelf'));
    el.heroImg.addEventListener('load', () => el.heroImg.classList.add('loaded'));
    el.heroImg.addEventListener('error', () => { state.heroFailed = true; el.heroFig.hidden = true; }); // 找不到圖片就整塊隱藏，不顯示破圖
    el.heroImg.addEventListener('click', () => openLightbox(el.heroImg));
    el.readBtn.addEventListener('click', startReading);
    el.homeBtn.addEventListener('click', () => { closeMenu(); savePosition(); showView('shelf'); });
    // 手機切到別的 App 或關閉分頁前，立刻記下位置；使用者自己動手捲動後，就不再自動校正位置
    document.addEventListener('visibilitychange', () => { if (document.hidden) savePosition(); });
    window.addEventListener('pagehide', savePosition);
    ['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach(ev => window.addEventListener(ev, () => { state.userMoved = true; }, { passive: true }));

    el.chapterToggle.addEventListener('click', toggleMenu);
    el.chapterList.addEventListener('click', e => {
      const item = e.target.closest('.chapter-item');
      if (!item) return;
      closeMenu();
      goChapter(Number(item.dataset.index));
    });
    document.addEventListener('pointerdown', e => {
      if (!el.chapterPanel.hidden && !e.target.closest('#chapterDropdown')) closeMenu();
    });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (!lb.root.hidden) { closeLightbox(); return; }
      if (!el.chapterPanel.hidden) { closeMenu(); el.chapterToggle.focus(); }
    });

    el.fsDec.addEventListener('click', () => setFontSize(state.fontSize - 1));
    el.fsInc.addEventListener('click', () => setFontSize(state.fontSize + 1));
    el.themeBtn.addEventListener('click', () => setTheme(state.theme === 'night' ? 'parchment' : 'night'));

    el.prevBtn.addEventListener('click', () => goChapter(state.chapterIndex - 1));
    el.nextBtn.addEventListener('click', () => goChapter(state.chapterIndex + 1));

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', () => { updateHint(); updateProgressBar(); });

    // 內文互動：揭曉黑條、點圖放大、圖片載入失敗時的替代顯示
    el.prose.addEventListener('click', e => {
      const redact = e.target.closest('.redact');
      if (redact) { redact.classList.toggle('show'); return; }
      const img = e.target.closest('img');
      if (img && !img.closest('a')) openLightbox(img);
    });
    el.prose.addEventListener('keydown', e => {
      const t = e.target;
      if ((e.key === 'Enter' || e.key === ' ') && t.classList && t.classList.contains('redact')) {
        e.preventDefault(); t.classList.toggle('show');
      }
    });
    el.prose.addEventListener('error', e => {
      const img = e.target;
      if (!(img instanceof HTMLImageElement)) return;
      const ph = document.createElement('span');
      ph.className = 'img-fallback';
      ph.textContent = '🖼 圖片無法載入' + (img.alt ? '：' + img.alt : '');
      img.replaceWith(ph);
    }, true);
    lb.root.addEventListener('click', closeLightbox);

    // 桌面：滑鼠滾輪直接橫向捲動書架
    el.scroller.addEventListener('wheel', e => {
      if (el.scroller.scrollWidth <= el.scroller.clientWidth) return;
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      e.preventDefault();
      el.scroller.scrollLeft += e.deltaY;
    }, { passive: false });
  }

  /* ================= 啟動 ================= */
  async function init() {
    setFontSize(store.get(KEY.fs, FS_DEFAULT), false);
    setTheme(store.get(KEY.theme, 'parchment'), false);
    bindEvents();

    try {
      const { site, books, items } = await loadConfig();
      state.siteTitle = site.title || 'J PORTAL';
      state.siteZh = site.titleZh || '';
      state.defaultAuthor = site.author || '';
      state.books = books;
      state.items = items;
      el.siteTitle.textContent = state.siteTitle;
      el.siteZh.textContent = state.siteZh; el.siteZh.hidden = !state.siteZh;
      el.siteTagline.textContent = site.tagline || '';
      document.title = shelfTitle();
      renderShelf();
    } catch (err) {
      setShelfStatus(err.message, true);
    }
    fx.start();
  }

  init();
})();
</script>
</body>
</html>
